  /* ---------------- storage ---------------- */
  const STORE_KEY = "wusi_quiz_v1";

  function defaultStore() {
    return {
      stats: { answered: 0, correct: 0, sessions: 0, best: 0, totalTime: 0 },
      chapters: {},
      wrong: {},
      recent: [],
      history: [],
      active: null,
      settings: {
        count: 20,
        types: { choice: true, fill: true, short: true },
      },
    };
  }

  function mergeStore(raw) {
    const base = defaultStore();
    if (!raw || typeof raw !== "object") return base;
    return {
      ...base,
      ...raw,
      stats: { ...base.stats, ...(raw.stats || {}) },
      chapters: raw.chapters && typeof raw.chapters === "object" ? raw.chapters : {},
      wrong: raw.wrong && typeof raw.wrong === "object" ? raw.wrong : {},
      recent: Array.isArray(raw.recent) ? raw.recent.slice(-120) : [],
      history: Array.isArray(raw.history) ? raw.history.slice(0, 40) : [],
      settings: {
        ...base.settings,
        ...(raw.settings || {}),
        types: { ...base.settings.types, ...((raw.settings || {}).types || {}) },
      },
    };
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return mergeStore(raw ? JSON.parse(raw) : null);
    } catch (err) {
      return defaultStore();
    }
  }

  let memoryStore = null;
  let store = loadStore();

  function saveStore() {
    memoryStore = store;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
    } catch (err) {
      /* 本地文件或隐私模式下可能不可用，保留内存状态即可。 */
    }
  }

  const app = {
    view: "home",
    paper: null,
    index: 0,
    timerId: null,
    ui: {
      bankChapter: "all",
      bankType: "all",
      bankSearch: "",
      cramConceal: false,
    },
    lastFocus: null,
  };

  function chapterStats(chId) {
    return store.chapters[chId] || { answered: 0, correct: 0 };
  }

  function wrongList() {
    return Object.keys(store.wrong)
      .map((id) => ({ id, q: Q_BY_ID.get(id), ...store.wrong[id] }))
      .filter((item) => item.q && !item.resolved)
      .sort((a, b) => (b.last || 0) - (a.last || 0));
  }

  function wrongCount() {
    return wrongList().length;
  }

  /* ---------------- paper building ---------------- */
  function allocateCount(count, groups) {
    const weights = { choice: 0.5, fill: 0.3, short: 0.2 };
    const n = groups.length;
    if (!n) return {};
    const quota = {};
    if (count <= n) {
      groups.forEach((g, i) => {
        quota[g] = i < count ? 1 : 0;
      });
      return quota;
    }
    groups.forEach((g) => {
      quota[g] = 1;
    });
    let remaining = count - n;
    const sum = groups.reduce((acc, g) => acc + (weights[g] || 0), 0) || 1;
    const raw = {};
    groups.forEach((g) => {
      raw[g] = (remaining * (weights[g] || 0)) / sum;
    });
    let used = 0;
    groups.forEach((g) => {
      const add = Math.floor(raw[g]);
      quota[g] += add;
      used += add;
    });
    let left = count - used - n;
    const order = groups.slice().sort((a, b) => (raw[b] % 1) - (raw[a] % 1));
    let i = 0;
    while (left > 0) {
      quota[order[i % order.length]] += 1;
      left -= 1;
      i += 1;
    }
    return quota;
  }

  function takeBalanced(pool, n, recentSet) {
    if (n <= 0 || !pool.length) return [];
    const byChapter = new Map();
    shuffle(pool).forEach((q) => {
      if (!byChapter.has(q.chapter)) byChapter.set(q.chapter, []);
      byChapter.get(q.chapter).push(q);
    });
    const chapterOrder = shuffle(Array.from(byChapter.keys()));
    const picked = [];
    while (picked.length < n) {
      let added = false;
      for (const ch of chapterOrder) {
        const arr = byChapter.get(ch);
        if (!arr || !arr.length) continue;
        let idx = arr.findIndex((q) => !recentSet.has(q.id));
        if (idx < 0) idx = 0;
        picked.push(arr.splice(idx, 1)[0]);
        added = true;
        if (picked.length >= n) break;
      }
      if (!added) break;
    }
    return picked;
  }

  function buildPaper(opts) {
    const settings = opts || {};
    const countWanted = Math.max(1, Number(settings.count) || 20);
    const types = { ...store.settings.types, ...(settings.types || {}) };
    const groups = ["choice", "fill", "short"].filter((g) => types[g]);
    const chapterFilter = settings.chapters && settings.chapters.length ? new Set(settings.chapters) : null;
    const recentSet = new Set(store.recent || []);
    const eligible = QUESTIONS.filter((q) => {
      if (chapterFilter && !chapterFilter.has(q.chapter)) return false;
      return groups.includes(groupOf(q));
    });
    if (!groups.length) return { items: [], actual: 0, requested: countWanted };
    const count = Math.min(countWanted, eligible.length);
    if (!count) return { items: [], actual: 0, requested: countWanted };

    const quota = allocateCount(count, groups);
    const used = new Set();
    const picked = [];

    function poolFor(group, extra) {
      return eligible.filter((q) => {
        if (used.has(q.id)) return false;
        if (groupOf(q) !== group) return false;
        if (extra && !extra(q)) return false;
        return true;
      });
    }

    function takeGroup(group, n) {
      if (n <= 0) return;
      if (group === "choice") {
        const multiN = n >= 3 ? Math.min(3, Math.max(1, Math.round(n * 0.18))) : 0;
        const multi = takeBalanced(poolFor("choice", (q) => q.type === "multiple"), multiN, recentSet);
        multi.forEach((q) => {
          used.add(q.id);
          picked.push(q);
        });
        const singleN = n - multi.length;
        const singles = takeBalanced(poolFor("choice", (q) => q.type === "single"), singleN, recentSet);
        singles.forEach((q) => {
          used.add(q.id);
          picked.push(q);
        });
        if (multi.length + singles.length < n) {
          const rest = takeBalanced(poolFor("choice"), n - multi.length - singles.length, recentSet);
          rest.forEach((q) => {
            used.add(q.id);
            picked.push(q);
          });
        }
      } else {
        const got = takeBalanced(poolFor(group), n, recentSet);
        got.forEach((q) => {
          used.add(q.id);
          picked.push(q);
        });
      }
    }

    groups.forEach((g) => takeGroup(g, quota[g] || 0));

    if (picked.length < count) {
      const rest = takeBalanced(
        eligible.filter((q) => !used.has(q.id)),
        count - picked.length,
        recentSet
      );
      rest.forEach((q) => {
        used.add(q.id);
        picked.push(q);
      });
    }

    const chosen = shuffle(picked).slice(0, count);
    const items = chosen.map((q) => {
      const optionOrder =
        q.type === "single" || q.type === "multiple"
          ? shuffle(q.options.map((_, idx) => idx))
          : [];
      return {
        qid: q.id,
        optionOrder,
        selected: [],
        response: q.type === "fill" ? new Array(q.blanks.length).fill("") : [],
        text: "",
        submitted: false,
        correct: null,
        selfGrade: null,
        blankResults: [],
        recorded: false,
        skipped: false,
      };
    });

    const now = Date.now();
    return {
      id: `paper-${now}-${randomInt(100000)}`,
      mode: settings.mode || "random",
      title: settings.title || "随机练习",
      count: items.length,
      requested: countWanted,
      createdAt: now,
      startedAt: now,
      elapsedMs: 0,
      pausedAt: null,
      index: 0,
      items,
      settings: { count: countWanted, types, chapters: settings.chapters || [] },
    };
  }

  function startPaper(opts) {
    const built = buildPaper(opts);
    if (!built.items.length) {
      showToast("没有符合条件的题目，请调整筛选。", "warn");
      return;
    }
    app.paper = built;
    app.index = 0;
    app.wrongJump = false;
    store.recent = Array.from(new Set([...(store.recent || []), ...built.items.map((it) => it.qid)])).slice(-120);
    saveActive();
    saveStore();
    app.view = "quiz";
    render();
    startTimer();
    focusView();
    if (built.requested > built.count) {
      showToast(`题库中符合条件的题目只有 ${built.count} 道，已按实际数量组卷。`, "warn");
    }
  }

  function serializePaper() {
    if (!app.paper) return null;
    return {
      ...app.paper,
      index: app.index,
      items: app.paper.items.map((it) => ({ ...it })),
    };
  }

  function saveActive() {
    store.active = serializePaper();
    saveStore();
  }

  function restoreActive() {
    const a = store.active;
    if (!a || !Array.isArray(a.items) || !a.items.length) return false;
    const items = a.items
      .map((it) => {
        const q = Q_BY_ID.get(it.qid);
        if (!q) return null;
        const isChoice = q.type === "single" || q.type === "multiple";
        return {
          ...it,
          optionOrder: isChoice
            ? Array.isArray(it.optionOrder) && it.optionOrder.length
              ? it.optionOrder.filter((i) => Number.isInteger(i) && i >= 0 && i < q.options.length)
              : q.options.map((_, i) => i)
            : [],
          selected: Array.isArray(it.selected) ? it.selected : [],
          response: q.type === "fill"
            ? Array.from({ length: q.blanks.length }, (_, i) => (it.response && it.response[i]) || "")
            : [],
          text: it.text || "",
          blankResults: Array.isArray(it.blankResults) ? it.blankResults : [],
        };
      })
      .filter(Boolean);
    if (!items.length) return false;
    const elapsedMs = Math.max(0, Number(a.elapsedMs) || 0);
    app.paper = {
      ...a,
      items,
      count: items.length,
      index: Math.min(Math.max(0, Number(a.index) || 0), items.length - 1),
      elapsedMs,
      pausedAt: null,
      startedAt: Date.now() - elapsedMs,
    };
    app.index = app.paper.index;
    return true;
  }

  function discardActive() {
    store.active = null;
    saveStore();
  }

  /* ---------------- timer ---------------- */
  function startTimer() {
    if (app.timerId) clearInterval(app.timerId);
    app.timerId = setInterval(() => {
      if (app.view !== "quiz" || !app.paper) return;
      const el = $("[data-timer]");
      if (el) el.textContent = formatDuration((Date.now() - (app.paper.startedAt || Date.now())) / 1000);
    }, 1000);
  }

  function paperElapsed() {
    if (!app.paper) return 0;
    const base = Math.max(0, Number(app.paper.elapsedMs) || 0);
    if (app.paper.pausedAt) return Math.floor(base / 1000);
    return Math.max(0, Math.floor((base + Date.now() - (app.paper.startedAt || Date.now())) / 1000));
  }

  function pausePaper() {
    if (!app.paper || app.paper.pausedAt) return;
    app.paper.elapsedMs =
      Math.max(0, Number(app.paper.elapsedMs) || 0) +
      Math.max(0, Date.now() - (app.paper.startedAt || Date.now()));
    app.paper.pausedAt = Date.now();
    saveActive();
    const el = $("[data-timer]");
    if (el) el.textContent = formatDuration(paperElapsed());
  }

  function resumePaper() {
    if (!app.paper || !app.paper.pausedAt) return;
    app.paper.startedAt = Date.now() - Math.max(0, Number(app.paper.elapsedMs) || 0);
    app.paper.pausedAt = null;
  }

  /* ---------------- grading helpers ---------------- */
  function numericTolerance(inputNorm, answerNorm) {
    if (!/^\d+$/.test(answerNorm)) return false;
    return new RegExp(`^0*${answerNorm}(年|月|日|人|名|条|个|种|次|周岁|岁|分|秒)?$`).test(inputNorm);
  }

  function blankCorrect(input, answers) {
    const n = normalize(input);
    if (!n) return false;
    return answers.some((a) => {
      const na = normalize(a);
      if (!na) return false;
      if (n === na) return true;
      if (numericTolerance(n, na)) return true;
      return false;
    });
  }

  function checkFill(q, item) {
    const results = q.blanks.map((blank, i) => blankCorrect(item.response[i] || "", blank.answers));
    item.blankResults = results;
    return results.length > 0 && results.every(Boolean);
  }

  function checkChoice(q, item) {
    const selected = new Set(item.selected || []);
    if (q.type === "single") {
      return selected.size === 1 && selected.has(q.answer);
    }
    const target = new Set(q.answer);
    if (selected.size !== target.size) return false;
    for (const v of target) if (!selected.has(v)) return false;
    return true;
  }

  function keywordHit(text, keywordGroup) {
    const norm = normalize(text);
    if (!norm) return false;
    const groups = Array.isArray(keywordGroup) ? keywordGroup : [keywordGroup];
    return groups.some((k) => norm.includes(normalize(k)));
  }

  function keywordResults(q, text) {
    return (q.keywords || []).map((group) => ({
      label: Array.isArray(group) ? group[0] : group,
      hit: keywordHit(text, group),
    }));
  }

  function recordAnswer(item, q, skipped) {
    if (item.recorded) return;
    item.recorded = true;
    item.skipped = Boolean(skipped);
    if (!skipped) {
      store.stats.answered += 1;
      const ch = store.chapters[q.chapter] || { answered: 0, correct: 0 };
      ch.answered += 1;
      if (item.correct) {
        store.stats.correct += 1;
        ch.correct += 1;
      }
      store.chapters[q.chapter] = ch;
    }
    if (item.correct) {
      const old = store.wrong[q.id];
      if (old) {
        old.resolved = true;
        old.right = (old.right || 0) + 1;
        old.lastRight = Date.now();
      }
    } else {
      const old = store.wrong[q.id] || {};
      store.wrong[q.id] = {
        ...old,
        wrong: (old.wrong || 0) + 1,
        resolved: false,
        last: Date.now(),
      };
    }
    saveStore();
  }

  function gradeItem(item, q) {
    if (q.type === "single" || q.type === "multiple") {
      item.correct = checkChoice(q, item);
    } else if (q.type === "fill") {
      item.correct = checkFill(q, item);
    } else if (q.type === "short") {
      if (item.selfGrade === null || item.selfGrade === undefined) {
        item.correct = null;
        return;
      }
      item.correct = Boolean(item.selfGrade);
    }
    item.submitted = true;
  }

  function answerText(q, item) {
    if (q.type === "single") return q.options[q.answer];
    if (q.type === "multiple") return q.answer.map((i) => q.options[i]).join("；");
    if (q.type === "fill") return q.blanks.map((b, i) => `第${i + 1}空：${b.display}`).join("；");
    return q.reference;
  }

  function userAnswerText(q, item) {
    if (q.type === "single" || q.type === "multiple") {
      if (!item.selected || !item.selected.length) return "未作答";
      return item.selected
        .slice()
        .sort((a, b) => a - b)
        .map((i) => `${String.fromCharCode(65 + i)}. ${q.options[i]}`)
        .join("；");
    }
    if (q.type === "fill") {
      return q.blanks
        .map((b, i) => `第${i + 1}空：${(item.response && item.response[i]) || "（空）"}`)
        .join("；");
    }
    return item.text || "未作答";
  }

  /* ---------------- navigation ---------------- */
  const NAV = [
    { id: "home", label: "开始练习", icon: "home" },
    { id: "bank", label: "全部题库", icon: "library" },
    { id: "wrong", label: "错题本", icon: "wrong" },
    { id: "cram", label: "考前速记", icon: "bolt" },
  ];

  function navHTML(mobile) {
    return NAV.map((item) => {
      const active = app.view === item.id || (app.view === "quiz" && item.id === "home");
      const count = item.id === "wrong" && wrongCount() ? `<span class="nav-badge">${wrongCount()}</span>` : "";
      return `<button class="nav-item ${active ? "active" : ""}" data-action="nav" data-view="${item.id}" type="button">
        ${icon(item.icon)}
        <span>${item.label}</span>${count}
      </button>`;
    }).join("");
  }

  function renderChrome() {
    $("#railNav").innerHTML = navHTML(false);
    $("#mobileNav").innerHTML = navHTML(true);
    const hours = new Date().getHours();
    const greet = hours < 11 ? "早上好" : hours < 14 ? "中午好" : hours < 19 ? "下午好" : "晚上好";
    $("#railGreet").textContent = greet;
  }

  function focusView() {
    const view = $("#view");
    if (view) {
      view.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function go(view) {
    if (view === "quiz" && !app.paper) view = "home";
    if (app.view === "quiz" && view !== "quiz") pausePaper();
    if (view === "quiz" && app.view !== "quiz") resumePaper();
    app.view = view;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function render() {
    renderChrome();
    const view = $("#view");
    if (!view) return;
    let html = "";
    if (app.view === "home") html = renderHome();
    else if (app.view === "quiz") html = renderQuiz();
    else if (app.view === "result") html = renderResult();
    else if (app.view === "bank") html = renderBank();
    else if (app.view === "wrong") html = renderWrong();
    else if (app.view === "cram") html = renderCram();
    else html = renderHome();
    view.innerHTML = html;
    view.classList.remove("view-enter");
    void view.offsetWidth;
    view.classList.add("view-enter");
    if (app.view === "quiz") updateQuizProgressUI();
  }

  /* ---------------- home ---------------- */
  function typeCount(group) {
    return QUESTIONS.filter((q) => groupOf(q) === group).length;
  }

  function renderHome() {
    const s = store.stats;
    const acc = s.answered ? `${pct(s.correct, s.answered)}%` : "—";
    const active = store.active;
    const settings = store.settings;
    const activeTotal = active && active.items ? active.items.length : 0;
    const activeDone = active && active.items ? active.items.filter((it) => it.submitted).length : 0;
    const resume = active && activeTotal
      ? `<div class="resume-bar">
          <div class="resume-icon">${icon("clock")}</div>
          <div class="resume-copy">
            <strong>上次练习还没做完</strong>
            <span>${escapeHTML(active.title || "随机练习")} · 已完成 ${activeDone}/${activeTotal} 题</span>
          </div>
          <button class="btn btn-ghost btn-sm" data-action="resume" type="button">继续答题 ${icon("arrow")}</button>
        </div>`
      : "";

    const typeToggle = (key) => {
      const on = settings.types[key];
      return `<button class="type-toggle ${on ? "on" : ""}" data-action="toggle-type" data-type="${key}" type="button" aria-pressed="${on}">
        <span class="check-dot">${on ? icon("check") : ""}</span>
        <span class="type-name">${GROUP_LABEL[key]}</span>
        <small>${typeCount(key)} 题</small>
      </button>`;
    };

    return `
      <section class="hero">
        <div class="hero-deco" aria-hidden="true">
          <span class="hero-year">1922</span>
          <span class="hero-ring ring-a"></span>
          <span class="hero-ring ring-b"></span>
          <span class="hero-ring ring-c"></span>
        </div>
        <div class="hero-grid">
          <div class="hero-copy">
            <div class="kicker"><span></span> 入团教育 · 考前强化</div>
            <h1>以青春之名<br /><em>把考点练熟</em></h1>
            <p class="hero-lead">依据《五四共青团》课件与考点梳理整理，覆盖团史、团徽团旗团歌、义务权利、入团程序、入团誓词等 9 大板块。每次随机组卷，选项顺序也会打乱。</p>
            <div class="hero-actions">
              <button class="btn btn-gold btn-lg" data-action="start-practice" type="button">${icon("play")} 开始随机练习</button>
              <button class="btn btn-ghost btn-lg" data-action="nav" data-view="cram" type="button">${icon("bolt")} 考前速记</button>
            </div>
            <div class="hero-meta">
              <span>${QUESTIONS.length} 道题</span><i></i><span>3 种题型</span><i></i><span>完全离线</span>
            </div>
          </div>
          <div class="hero-seal" aria-hidden="true">
            <div class="seal-inner">
              <img src="${asset("emblem")}" alt="" />
            </div>
            <div class="seal-caption">中国共青团 · 1922</div>
          </div>
        </div>
      </section>

      ${resume}

      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">题库总量</span>
          <strong>${QUESTIONS.length}<small>道</small></strong>
          <span class="stat-foot">9 个章节 · 3 种题型</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">累计作答</span>
          <strong>${s.answered}<small>题</small></strong>
          <span class="stat-foot">练过的每一题都算数</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">累计正确率</span>
          <strong>${acc}</strong>
          <span class="stat-foot">${s.answered ? `答对 ${s.correct} 题` : "做完一组后生成"}</span>
        </div>
        <div class="stat-card accent">
          <span class="stat-label">待复习错题</span>
          <strong>${wrongCount()}<small>道</small></strong>
          <span class="stat-foot">${wrongCount() ? "错题会反复出现" : "目前很干净"}</span>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <div class="eyebrow">随机组卷</div>
            <h2>选个题量，马上开练</h2>
          </div>
          <span class="section-note">每次抽题不重复 · 选项顺序随机</span>
        </div>

        <div class="practice-grid">
          <div class="panel practice-panel">
            <div class="setting-row">
              <div class="setting-copy">
                <strong>本组题量</strong>
                <span>建议标准 20 题，考前冲刺选 30 题</span>
              </div>
              <div class="segmented" role="group" aria-label="选择本组题量">
                ${[10, 20, 30]
                  .map(
                    (n) =>
                      `<button class="${settings.count === n ? "active" : ""}" data-action="set-count" data-count="${n}" type="button">${n} 题</button>`
                  )
                  .join("")}
              </div>
            </div>
            <div class="setting-row">
              <div class="setting-copy">
                <strong>题型范围</strong>
                <span>至少保留一种；简答题提交后对照答案自评</span>
              </div>
              <div class="type-toggles">
                ${typeToggle("choice")}
                ${typeToggle("fill")}
                ${typeToggle("short")}
              </div>
            </div>
            <div class="practice-start">
              <div class="practice-hint">${icon("spark")} 预计用时约 ${Math.max(5, Math.ceil(settings.count * 0.7))} 分钟</div>
              <button class="btn btn-primary btn-lg" data-action="start-practice" type="button">随机抽题 ${icon("arrow")}</button>
            </div>
          </div>

          <aside class="panel tip-panel">
            <div class="tip-head">${icon("bulb")} 考前建议</div>
            <p>先做一组 <strong>20 题</strong> 找手感，再按错题回填章节。入团誓词、团徽五要素、义务权利、入团程序是性价比最高的四块。</p>
            <div class="tip-facts">
              <span>必背</span>
              <strong>誓词 · 五要素 · 6+6 · 7 步</strong>
            </div>
            <button class="text-link" data-action="nav" data-view="cram" type="button">打开考前速记 ${icon("chevron")}</button>
          </aside>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <div class="eyebrow">分章突破</div>
            <h2>按知识点各个击破</h2>
          </div>
          <span class="section-note">点击章节，随机抽 10 题</span>
        </div>
        <div class="chapter-grid">
          ${CHAPTERS.map((ch) => {
            const total = QUESTIONS.filter((q) => q.chapter === ch.id).length;
            const st = chapterStats(ch.id);
            const width = total ? Math.min(100, pct(st.answered, total)) : 0;
            return `<button class="chapter-card" data-action="start-chapter" data-chapter="${ch.id}" type="button">
              <div class="chapter-top">
                <span class="chapter-no">${ch.no}</span>
                <span class="chapter-arrow">${icon("arrow")}</span>
              </div>
              <strong>${ch.name}</strong>
              <span class="chapter-sub">${ch.sub} · ${ch.desc}</span>
              <div class="chapter-foot">
                <span>${total} 题</span>
                <span>已练 ${st.answered} 题</span>
              </div>
              <div class="mini-track"><span style="width:${width}%"></span></div>
            </button>`;
          }).join("")}
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <div class="eyebrow">考前一眼</div>
            <h2>最容易考的几组数字</h2>
          </div>
          <span class="section-note">进考场前再看一遍</span>
        </div>
        <div class="fact-strip">
          <div class="fact"><span>成立</span><strong>1922.5</strong><small>广州 · 团一大</small></div>
          <div class="fact"><span>团徽</span><strong>1959.5.4</strong><small>共青团中央颁布</small></div>
          <div class="fact"><span>条数</span><strong>6 / 6 / 7</strong><small>义务 / 权利 / 程序</small></div>
          <div class="fact"><span>誓词</span><strong>志愿</strong><small>不是“自愿”</small></div>
          <div class="fact"><span>入团年龄</span><strong>14—28</strong><small>周岁</small></div>
        </div>
      </section>

      <footer class="home-foot">
        <img src="${asset("emblem")}" alt="" />
        <p>题库依据《五四共青团》入团宣传教育课件与《内容梳理与考点》整理。课件与现行《团章》表述不一致处，已在题目解析中注明；答题时请以题目给出的口径为准。</p>
        <span>离线可用 · 记录保存在本机浏览器</span>
      </footer>
    `;
  }

  /* ---------------- quiz ---------------- */
  function currentItem() {
    return app.paper ? app.paper.items[app.index] : null;
  }

  function currentQuestion() {
    const item = currentItem();
    return item ? Q_BY_ID.get(item.qid) : null;
  }

  function paperScore() {
    if (!app.paper) return { correct: 0, answered: 0, total: 0 };
    return app.paper.items.reduce(
      (acc, it) => {
        if (it.submitted) acc.answered += 1;
        if (it.correct) acc.correct += 1;
        acc.total += 1;
        return acc;
      },
      { correct: 0, answered: 0, total: 0 }
    );
  }

  function optionClass(q, item, origIndex) {
    if (!item.submitted) {
      return item.selected.includes(origIndex) ? "selected" : "";
    }
    const isCorrect = q.type === "single" ? q.answer === origIndex : q.answer.includes(origIndex);
    const isSelected = item.selected.includes(origIndex);
    if (isCorrect) return "is-correct";
    if (isSelected) return "is-wrong";
    return "muted";
  }

  function renderOptions(q, item) {
    return `<div class="options" role="group" aria-label="选项">
      ${item.optionOrder
        .map((orig, pos) => {
          const letter = String.fromCharCode(65 + pos);
          return `<button class="option ${optionClass(q, item, orig)}" data-action="option" data-orig="${orig}" type="button" ${item.submitted ? "disabled" : ""} aria-pressed="${item.selected.includes(orig)}">
            <span class="option-letter">${letter}</span>
            <span class="option-text">${escapeHTML(q.options[orig])}</span>
            <span class="option-mark">${item.submitted && optionClass(q, item, orig) === "is-correct" ? icon("check") : item.submitted && optionClass(q, item, orig) === "is-wrong" ? icon("close") : ""}</span>
          </button>`;
        })
        .join("")}
    </div>`;
  }

  function renderFill(q, item) {
    const parts = q.question.split(/\{\{\d+\}\}/);
    let html = `<div class="fill-text">`;
    parts.forEach((part, i) => {
      html += `<span>${escapeHTML(part)}</span>`;
      if (i < q.blanks.length) {
        const blank = q.blanks[i];
        const val = (item.response && item.response[i]) || "";
        const cls = item.submitted ? (item.blankResults && item.blankResults[i] ? "ok" : "bad") : "";
        const width = Math.min(16, Math.max(4, String(blank.display || "").length + 1.5));
        html += `<span class="blank-wrap ${cls}">
          <input class="blank-input" data-blank="${i}" value="${escapeAttr(val)}" ${item.submitted ? "disabled" : ""} autocomplete="off" spellcheck="false" aria-label="第${i + 1}空" style="width:${width}em" />
          <span class="blank-no">${i + 1}</span>
        </span>`;
      }
    });
    html += `</div>`;
    return html;
  }

  function renderKeywordChips(q, item) {
    if (!item.submitted) return "";
    const results = keywordResults(q, item.text);
    const hit = results.filter((r) => r.hit).length;
    return `<div class="keyword-box">
      <div class="keyword-head"><span>关键词覆盖</span><strong>${hit}/${results.length}</strong></div>
      <div class="keyword-chips">
        ${results
          .map(
            (r) =>
              `<span class="keyword-chip ${r.hit ? "hit" : ""}">${r.hit ? icon("check") : "<i></i>"}${escapeHTML(r.label)}</span>`
          )
          .join("")}
      </div>
    </div>`;
  }

  function renderFeedback(q, item) {
    if (!item.submitted) return "";
    const isShort = q.type === "short";
    const waiting = isShort && (item.selfGrade === null || item.selfGrade === undefined);
    const ok = item.correct === true;
    const bad = item.correct === false;
    const tone = waiting ? "neutral" : ok ? "ok" : "bad";
    const heading = waiting ? "对照参考答案，给自己评个分" : ok ? "回答正确" : "这题先记下来";
    const line = waiting
      ? "简答题不自动判分：先看参考答案，再点“掌握了”或“还要复习”。"
      : ok
      ? sampleOne(PRAISE)
      : sampleOne(ENCOURAGE);
    return `<div class="feedback ${tone}" role="status" aria-live="polite">
      <div class="feedback-mark">${waiting ? icon("bulb") : ok ? icon("check") : icon("close")}</div>
      <div class="feedback-copy">
        <strong>${heading}</strong>
        <p>${line}</p>
      </div>
    </div>
    ${isShort ? renderKeywordChips(q, item) : ""}
    <div class="explain ${isShort ? "short-reference" : ""}">
      <div class="explain-answer"><span>${isShort ? "参考答案" : "正确答案"}</span><div class="${isShort ? "reference" : ""}">${escapeHTML(answerText(q, item))}</div></div>
      <p class="explain-text">${escapeHTML(q.explanation)}</p>
      <div class="explain-foot"><span>${icon("book")} ${escapeHTML(q.source)}</span><span>题目编号 ${q.id}</span></div>
    </div>
    ${isShort ? `<div class="self-grade ${waiting ? "" : "done"}">
      <span>${waiting ? "你觉得自己答得怎么样？" : "自评结果"}</span>
      <div class="self-buttons">
        <button class="btn ${item.selfGrade === true ? "btn-ok" : "btn-ghost"}" data-action="self-grade" data-correct="1" type="button" ${waiting ? "" : "disabled"}>${icon("check")} 掌握了</button>
        <button class="btn ${item.selfGrade === false ? "btn-bad" : "btn-ghost"}" data-action="self-grade" data-correct="0" type="button" ${waiting ? "" : "disabled"}>${icon("refresh")} 还要复习</button>
      </div>
    </div>` : ""}`;
  }

  function navDots() {
    return app.paper.items
      .map((it, i) => {
        let cls = "";
        if (i === app.index) cls = "current";
        else if (it.correct === true) cls = "ok";
        else if (it.correct === false) cls = "bad";
        else if (it.submitted) cls = "done";
        return `<button class="dot ${cls}" data-action="jump" data-index="${i}" type="button" aria-label="第 ${i + 1} 题">${i + 1}</button>`;
      })
      .join("");
  }

  function renderQuiz() {
    if (!app.paper) return renderHome();
    const item = currentItem();
    const q = currentQuestion();
    if (!item || !q) return renderHome();
    const score = paperScore();
    const total = app.paper.items.length;
    const ch = CH_BY_ID.get(q.chapter);
    const done = app.index === total - 1 && item.submitted;
    const needsSelf = q.type === "short" && item.submitted && (item.selfGrade === null || item.selfGrade === undefined);
    const progress = ((app.index + (item.submitted ? 1 : 0)) / total) * 100;
    const isMulti = q.type === "multiple";
    const canSubmit =
      q.type === "single" || q.type === "multiple"
        ? item.selected.length > 0
        : q.type === "fill"
        ? (item.response || []).some((v) => String(v).trim())
        : String(item.text || "").trim().length > 0;
    return `<div class="quiz-shell">
      <div class="quiz-top">
        <button class="back-btn" data-action="quit" type="button">${icon("back")} 保存并退出</button>
        <div class="quiz-crumb">
          <span class="quiz-mode">${escapeHTML(app.paper.title)}</span>
          <span class="crumb-divider">/</span>
          <span>${ch ? escapeHTML(ch.name) : ""}</span>
        </div>
        <div class="quiz-clock">${icon("clock")}<span data-timer>${formatDuration(paperElapsed())}</span></div>
      </div>

      <div class="progress-line"><span style="width:${progress}%"></span></div>

      <div class="quiz-grid">
        <main class="question-card">
          <div class="question-meta">
            <span class="q-number">第 <strong>${app.index + 1}</strong> / ${total} 题</span>
            <span class="q-type ${q.type}">${typeLabel(q.type)}${isMulti ? " · 多选" : ""}</span>
            <span class="q-chapter">${escapeHTML(ch ? ch.name : "")}</span>
            <span class="q-diff" title="难度">${"●".repeat(q.difficulty)}${"○".repeat(3 - q.difficulty)}</span>
          </div>

          ${q.type === "fill" ? "" : `<h1 class="question-text">${escapeHTML(q.question)}</h1>`}
          ${q.image ? `<div class="question-image"><img src="${asset(q.image)}" alt="题目配图" /></div>` : ""}

          ${q.type === "single" || q.type === "multiple" ? renderOptions(q, item) : ""}
          ${q.type === "fill" ? renderFill(q, item) : ""}
          ${
            q.type === "short"
              ? `<div class="short-wrap">
                  <textarea class="short-input" data-short rows="6" placeholder="先自己在心里列要点，再写下来；提交后对照参考答案自评。" ${item.submitted ? "disabled" : ""}>${escapeHTML(item.text || "")}</textarea>
                  <div class="short-count"><span data-char-count>${String(item.text || "").length}</span> 字 <span>·</span> 建议分点作答</div>
                </div>`
              : ""
          }

          ${renderFeedback(q, item)}

          <div class="question-actions">
            <div class="shortcut-hint">${item.submitted ? "Enter 下一题" : isMulti ? "可多选 · Enter 提交" : q.type === "fill" ? "Tab 切换空格 · Enter 提交" : q.type === "short" ? "Enter 换行 · Ctrl+Enter 提交" : "按 A–D 或 1–4 选择 · Enter 提交"}</div>
            <div class="action-buttons">
              ${
                !item.submitted
                  ? `<button class="btn btn-primary btn-lg" data-action="submit" type="button" ${canSubmit ? "" : "disabled"}>提交答案 ${icon("arrow")}</button>`
                  : needsSelf
                  ? `<button class="btn btn-ghost btn-lg" data-action="next" type="button" disabled>请先自评 ${icon("arrow")}</button>`
                  : `<button class="btn btn-primary btn-lg" data-action="${done ? "finish" : "next"}" type="button">${done ? "查看成绩" : "下一题"} ${icon("arrow")}</button>`
              }
            </div>
          </div>
        </main>

        <aside class="quiz-side">
          <div class="side-card score-card">
            <div class="side-label">本组进度</div>
            <div class="side-score"><strong>${score.correct}</strong><span>/ ${score.answered} 已答</span></div>
            <div class="side-sub">共 ${total} 题 · 正确率 ${score.answered ? pct(score.correct, score.answered) + "%" : "—"}</div>
            <button class="btn btn-ghost btn-sm side-finish" data-action="finish" type="button">提前交卷</button>
          </div>
          <div class="side-card nav-card">
            <div class="side-label">题目导航</div>
            <div class="dot-grid">${navDots()}</div>
            <div class="dot-legend">
              <span><i class="lg current"></i>当前</span>
              <span><i class="lg ok"></i>正确</span>
              <span><i class="lg bad"></i>错误</span>
            </div>
          </div>
          <div class="side-card quote-card">
            <div class="quote-mark">“</div>
            <p>青年之字典，无“困难”之字；青年之口头，无“障碍”之语。</p>
            <span>—— 李大钊</span>
          </div>
        </aside>
      </div>
    </div>`;
  }

  function updateQuizProgressUI() {
    const el = $("[data-timer]");
    if (el && app.paper) el.textContent = formatDuration(paperElapsed());
  }

  /* ---------------- result ---------------- */
  function computeResult() {
    if (!app.paper) return null;
    const total = app.paper.items.length;
    let correct = 0;
    let answered = 0;
    const byType = {};
    app.paper.items.forEach((it) => {
      const q = Q_BY_ID.get(it.qid);
      if (!q) return;
      if (it.submitted && !it.skipped) answered += 1;
      if (it.correct) correct += 1;
      const g = groupOf(q);
      byType[g] = byType[g] || { total: 0, correct: 0 };
      byType[g].total += 1;
      if (it.correct) byType[g].correct += 1;
    });
    return {
      total,
      answered,
      correct,
      score: pct(correct, total),
      accuracy: answered ? pct(correct, answered) : 0,
      byType,
      elapsed: paperElapsed(),
    };
  }

  function resultCopy(score) {
    if (score >= 90) return { title: "稳了，这套可以闭眼过", sub: "保持手感，考前把错题再看一眼。" };
    if (score >= 75) return { title: "不错，再抠一抠易错点", sub: "把错题对应的条款补全，分数还能再涨。" };
    if (score >= 60) return { title: "及格线以上，错题要回看", sub: "先背誓词、五要素、6+6、7 步，这四块提分最快。" };
    return { title: "别慌，先把错题吃透", sub: "错题不是坏消息，是考前最精准的复习清单。" };
  }

      </div>
    </div>`;
    modal.classList.add("open");
    document.body.classList.add("modal-open");
    const first = modal.querySelector("button, input, textarea");
    if (first) setTimeout(() => first.focus(), 30);

  function closeModal() {
    const modal = $("#modalRoot");
    modal.classList.remove("open");

    document.body.classList.remove("modal-open");
    if (app.lastFocus && app.lastFocus.focus) app.lastFocus.focus();

  let toastTimer = null;
  function showToast(message, tone) {
    const el = $("#toast");

    toastTimer = setTimeout(() => {
      el.className = "toast";

  /* ---------------- actions ---------------- */
  function startQuestionByIds(ids, title, mode) {
    const qs = ids.map((id) => Q_BY_ID.get(id)).filter(Boolean);
    if (!qs.length) {
      showToast("没有可练习的题目。", "warn");
      return;
    }
    const items = qs.map((q) => ({
      qid: q.id,
      optionOrder:
        q.type === "single" || q.type === "multiple"
          ? shuffle(q.options.map((_, i) => i))
          : [],
      selected: [],
      response: q.type === "fill" ? new Array(q.blanks.length).fill("") : [],
      text: "",
      submitted: false,
      correct: null,
      selfGrade: null,
      blankResults: [],
      recorded: false,
      skipped: false,
    }));
    const now = Date.now();
    app.paper = {
      id: `paper-${now}-${randomInt(100000)}`,
      mode: mode || "custom",
      title: title || "专项练习",
      count: items.length,
      requested: items.length,
      createdAt: now,
      startedAt: now,
      elapsedMs: 0,
      pausedAt: null,
      index: 0,
      items,
      settings: { count: items.length, types: { ...store.settings.types }, chapters: [] },
    };
    app.index = 0;
    store.recent = Array.from(new Set([...(store.recent || []), ...ids])).slice(-120);
    saveActive();
    saveStore();
    app.view = "quiz";
    render();
    startTimer();
    focusView();
  }

  function startChapter(chId) {
    const ch = CH_BY_ID.get(chId);
    if (!ch) return;
    startPaper({
      count: 10,
      types: { choice: true, fill: true, short: true },
      chapters: [chId],
      mode: "chapter",
      title: `分章练习 · ${ch.name}`,
    });
  }

  function submitCurrent() {
    if (!app.paper) return;
    const item = currentItem();
    const q = currentQuestion();
    if (!item || !q || item.submitted) return;
    if (q.type === "single" || q.type === "multiple") {
      if (!item.selected.length) return;
      item.correct = checkChoice(q, item);
      item.submitted = true;
      recordAnswer(item, q, false);
    } else if (q.type === "fill") {
      if (!(item.response || []).some((v) => String(v).trim())) return;
      item.correct = checkFill(q, item);
      item.submitted = true;
      recordAnswer(item, q, false);
    } else if (q.type === "short") {
      if (!String(item.text || "").trim()) {
        showToast("先写一点你的答案，再提交。", "warn");
        return;
      }
      item.submitted = true;
      item.correct = null;
      item.blankResults = [];
    }
    saveActive();
    render();
  }

  function selfGradeCurrent(value) {
    if (!app.paper) return;
    const item = currentItem();
    const q = currentQuestion();
    if (!item || !q || q.type !== "short" || !item.submitted) return;
    item.selfGrade = value;
    item.correct = Boolean(value);
    recordAnswer(item, q, false);
    saveActive();
    render();
  }

  function nextQuestion() {
    if (!app.paper) return;
    if (app.index < app.paper.items.length - 1) {
      app.index += 1;
      saveActive();
      render();
      focusView();
    } else {
      finishPaper(false);
    }
  }

  function finishPaper(skipConfirm) {
    if (!app.paper) return;
    const unresolvedSelf = app.paper.items.some((it) => {
      const q = Q_BY_ID.get(it.qid);
      return it.submitted && q && q.type === "short" && it.selfGrade === null;
    });
    const unanswered = app.paper.items.filter((it) => !it.submitted).length;
    if (!skipConfirm && (unanswered > 0 || unresolvedSelf)) {
      openModal({
        title: "确定交卷吗？",
        body: `<p class="modal-text">${unanswered ? `还有 <strong>${unanswered}</strong> 道题未作答。` : ""}${unresolvedSelf ? "有简答题还没有自评。" : ""}未作答和未自评的题会按错误计入本组成绩，交卷后仍可回看解析。</p>`,
        actions: `<button class="btn btn-ghost" data-modal-close="1" type="button">继续答题</button>
          <button class="btn btn-primary" data-modal-action="confirm-finish" type="button">确认交卷 ${icon("arrow")}</button>`,
      });
      return;
    }

    app.paper.items.forEach((it) => {
      const q = Q_BY_ID.get(it.qid);
      if (!q) return;
      if (!it.submitted) {
        it.submitted = true;
        it.correct = false;
        it.skipped = true;
        it.blankResults = [];
        recordAnswer(it, q, true);
      } else if (q.type === "short" && (it.selfGrade === null || it.selfGrade === undefined)) {
        it.selfGrade = false;
        it.correct = false;
        recordAnswer(it, q, false);
      }
    });

    const r = computeResult();
    store.stats.sessions += 1;
    store.stats.totalTime += r.elapsed;
    store.stats.best = Math.max(store.stats.best || 0, r.score);
    store.history.unshift({
      at: Date.now(),
      score: r.score,
      correct: r.correct,
      total: r.total,
      title: app.paper.title,
      elapsed: r.elapsed,
    });
    store.history = store.history.slice(0, 30);
    store.active = null;
    app.paper.finishedAt = Date.now();
    if (app.timerId) {
      clearInterval(app.timerId);
      app.timerId = null;
    }
    saveStore();
    closeModal();
    app.view = "result";
    render();
    focusView();
  }

  function quitQuiz() {
    if (!app.paper) {
      go("home");
      return;
    }
    saveActive();
    openModal({
      title: "保存并退出？",
      body: `<p class="modal-text">本组进度会保存在本机，下次回来可以从当前题继续。已作答的题目会自动计入统计。</p>`,
      actions: `<button class="btn btn-ghost" data-modal-close="1" type="button">继续答题</button>
        <button class="btn btn-primary" data-modal-action="confirm-quit" type="button">退出到首页</button>`,
    });
  }

  function resetQuizConfirm() {
    if (!app.paper) return;
    openModal({
      title: "重新开始本组？",
      body: `<p class="modal-text">当前作答记录会被清空，并重新随机抽题。已计入错题本的记录不会丢失。</p>`,
      actions: `<button class="btn btn-ghost" data-modal-close="1" type="button">取消</button>
        <button class="btn btn-primary" data-modal-action="confirm-retry" type="button">重新抽题</button>`,
    });
  }

  function viewQuestion(qid) {
    const q = Q_BY_ID.get(qid);
    if (!q) return;
    const ch = CH_BY_ID.get(q.chapter);
    openModal({
      title: "题目解析",
      body: `<div class="modal-question-meta"><span class="q-type ${q.type}">${typeLabel(q.type)}</span><span>${ch.no} ${escapeHTML(ch.name)}</span><span>${"●".repeat(q.difficulty)}${"○".repeat(3 - q.difficulty)}</span></div>
        <h3 class="modal-question">${escapeHTML(stripTags(q.question))}</h3>
        ${q.image ? `<div class="modal-image"><img src="${asset(q.image)}" alt="" /></div>` : ""}
        ${q.options ? `<ol class="modal-options">${q.options.map((o, i) => `<li class="${(q.type === "single" ? q.answer === i : q.answer.includes(i)) ? "right" : ""}"><span>${String.fromCharCode(65 + i)}</span>${escapeHTML(o)}</li>`).join("")}</ol>` : ""}
        <div class="modal-answer"><span>答案</span><p>${escapeHTML(answerText(q, { selected: [], response: [] }))}</p></div>
        <div class="modal-explain">${escapeHTML(q.explanation)}</div>
        <div class="modal-source">${icon("book")} ${escapeHTML(q.source)}</div>`,
      actions: `<button class="btn btn-ghost" data-modal-close="1" type="button">关闭</button>
        <button class="btn btn-primary" data-action="practice-one" data-qid="${q.id}" type="button">练这题 ${icon("arrow")}</button>`,
    });
  }

  function clearWrongConfirm() {
    const n = wrongCount();
    if (!n) return;
    openModal({
      title: "清空错题本？",
      body: `<p class="modal-text">将删除全部 <strong>${n}</strong> 道待复习错题，操作不可撤销。累计统计不会清零。</p>`,
      actions: `<button class="btn btn-ghost" data-modal-close="1" type="button">取消</button>
        <button class="btn btn-bad" data-modal-action="confirm-clear-wrong" type="button">确认清空</button>`,
    });
  }

  /* ---------------- event wiring ---------------- */
  document.addEventListener("click", (event) => {
    const modalClose = event.target.closest("[data-modal-close]");
    if (modalClose) {
      const isBackdrop = modalClose.classList.contains("modal-backdrop");
      if (!isBackdrop || event.target === modalClose) {
        closeModal();
        return;
      }
    }
    const modalAction = event.target.closest("[data-modal-action]");
    if (modalAction) {
      const action = modalAction.dataset.modalAction;
      if (action === "confirm-finish") {
        finishPaper(true);
      } else if (action === "confirm-quit") {
        closeModal();
        saveActive();
        go("home");
      } else if (action === "confirm-retry") {
        const old = app.paper;
        closeModal();
        if (old) {
          startPaper({
            count: old.requested || old.count,
            types: old.settings.types,
            chapters: old.settings.chapters,
            mode: old.mode,
            title: old.title,
          });
        }
      } else if (action === "confirm-clear-wrong") {
        store.wrong = {};
        saveStore();
        closeModal();
        render();
        showToast("错题本已清空。");
      }
      return;
    }
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "nav") {
      go(target.dataset.view);
    } else if (action === "set-count") {
      store.settings.count = Number(target.dataset.count) || 20;
      saveStore();
      render();
    } else if (action === "toggle-type") {
      const key = target.dataset.type;
      const types = store.settings.types;
      const onCount = Object.values(types).filter(Boolean).length;
      if (types[key] && onCount <= 1) {
        showToast("至少保留一种题型。", "warn");
        return;
      }
      types[key] = !types[key];
      saveStore();
      render();
    } else if (action === "start-practice") {
      startPaper({
        count: store.settings.count,
        types: store.settings.types,
        mode: "random",
        title: "随机练习",
      });
    } else if (action === "start-chapter") {
      startChapter(target.dataset.chapter);
    } else if (action === "resume") {
      if (restoreActive()) {
        resumePaper();
        app.view = "quiz";
        render();
        startTimer();
        focusView();
      } else {
        discardActive();
        showToast("上次练习已失效，重新来一组吧。", "warn");
        render();
      }
    } else if (action === "option") {
      const item = currentItem();
      const q = currentQuestion();
      if (!item || !q || item.submitted) return;
      const orig = Number(target.dataset.orig);
      if (q.type === "single") {
        item.selected = [orig];
      } else if (q.type === "multiple") {
        const set = new Set(item.selected);
        if (set.has(orig)) set.delete(orig);
        else set.add(orig);
        item.selected = Array.from(set);
      }
      saveActive();
      render();
    } else if (action === "submit") {
      submitCurrent();
    } else if (action === "next") {
      nextQuestion();
    } else if (action === "finish") {
      finishPaper(false);
    } else if (action === "self-grade") {
      selfGradeCurrent(target.dataset.correct === "1");
    } else if (action === "jump") {
      app.index = Number(target.dataset.index) || 0;
      saveActive();
      render();
      focusView();
    } else if (action === "quit") {
      quitQuiz();
    } else if (action === "retry") {
      if (app.paper) {
        startPaper({
          count: app.paper.requested || app.paper.count,
          types: app.paper.settings.types,
          chapters: app.paper.settings.chapters,
          mode: app.paper.mode,
          title: app.paper.title,
        });
      }
    } else if (action === "review-wrong") {
      if (!app.paper) return;
      const ids = app.paper.items.filter((it) => it.correct === false).map((it) => it.qid);
      startQuestionByIds(ids, "本组错题重练", "review");
    } else if (action === "review-all-wrong") {
      const ids = wrongList().map((w) => w.id);
      startQuestionByIds(shuffle(ids).slice(0, 30), "错题本重练", "review");
    } else if (action === "practice-one") {
      closeModal();
      startQuestionByIds([target.dataset.qid], "单题练习", "single");
    } else if (action === "view-question") {
      viewQuestion(target.dataset.qid);
    } else if (action === "toggle-cram") {
      app.ui.cramConceal = !app.ui.cramConceal;
      render();
    } else if (action === "reveal-cram") {
      target.classList.toggle("revealed");
    } else if (action === "clear-wrong") {
      clearWrongConfirm();
    }
  });

  document.addEventListener("input", (event) => {
    const el = event.target;
    if (el.matches("[data-blank]")) {
      const item = currentItem();
      if (!item || item.submitted) return;
      const i = Number(el.dataset.blank);
      item.response[i] = el.value;
      const submit = $('[data-action="submit"]');
      if (submit) {
        const any = (item.response || []).some((v) => String(v).trim());
        submit.disabled = !any;
      }
      saveActive();
    } else if (el.matches("[data-short]")) {
      const item = currentItem();
      if (!item || item.submitted) return;
      item.text = el.value;
      const counter = $("[data-char-count]");
      if (counter) counter.textContent = String(el.value.length);
      const submit = $('[data-action="submit"]');
      if (submit) submit.disabled = !el.value.trim();
      saveActive();
    }
  });

  document.addEventListener("change", (event) => {
    const el = event.target;
    if (el.id === "bankType") {
      app.ui.bankType = el.value;
      render();
    } else if (el.id === "bankChapter") {
      app.ui.bankChapter = el.value;
      render();
    }
  });

  document.addEventListener("input", (event) => {
    if (event.target.id === "bankSearch") filterBankDOM();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if ($("#modalRoot").classList.contains("open")) closeModal();
      return;
    }
    if (document.body.classList.contains("modal-open")) return;
    if (app.view !== "quiz" || !app.paper) return;
    const item = currentItem();
    const q = currentQuestion();
    if (!item || !q) return;
    const tag = (event.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea";

    if (event.key === "Enter") {
      if (typing && q.type === "short" && !event.ctrlKey && !event.metaKey) return;
      if (typing && q.type === "fill" && event.target.matches("[data-blank]")) {
        const inputs = $$("[data-blank]");
        const idx = inputs.indexOf(event.target);
        if (idx >= 0 && idx < inputs.length - 1) {
          event.preventDefault();
          inputs[idx + 1].focus();
          return;
        }
      }
      event.preventDefault();
      if (!item.submitted) {
        const btn = $('[data-action="submit"]');
        if (btn && !btn.disabled) submitCurrent();
      } else if (!(q.type === "short" && item.selfGrade === null)) {
        nextQuestion();
      }
      return;
    }

    if (!typing && !item.submitted && (q.type === "single" || q.type === "multiple")) {
      const key = event.key.toUpperCase();
      const digits = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
      let pos = -1;
      if (/^[A-H]$/.test(key)) pos = key.charCodeAt(0) - 65;
      else if (digits.includes(key)) pos = Number(key) - 1;
      if (pos >= 0 && pos < item.optionOrder.length) {
        event.preventDefault();
        const orig = item.optionOrder[pos];
        if (q.type === "single") item.selected = [orig];
        else {
          const set = new Set(item.selected);
          if (set.has(orig)) set.delete(orig);
          else set.add(orig);
          item.selected = Array.from(set);
        }
        saveActive();
        render();
      }
    }
  });

  /* ---------------- debug / preview ---------------- */
  function buildPreview() {
    const params = new URLSearchParams(window.location.search);
    const preview = params.get("preview");
    if (!preview) return;
    if (preview === "quiz") {
      store.settings.count = 10;
      const built = buildPaper({
        count: 10,
        types: { choice: true, fill: true, short: true },
        mode: "random",
        title: "随机练习",
      });
      app.paper = built;
      app.index = 0;
      app.view = "quiz";
      render();
      startTimer();
    } else if (preview === "result") {
      const built = buildPaper({
        count: 10,
        types: { choice: true, fill: true, short: true },
        mode: "random",
        title: "随机练习",
      });
      app.paper = built;
      built.items.forEach((it, i) => {
        const q = Q_BY_ID.get(it.qid);
        it.submitted = true;
        it.correct = i % 4 !== 0;
        if (q.type === "short") it.selfGrade = it.correct;
      });
      app.view = "result";
      render();
    } else if (preview === "bank") {
      app.view = "bank";
      render();
    } else if (preview === "wrong") {
      const qs = shuffle(QUESTIONS).slice(0, 4);
      qs.forEach((q) => {
        store.wrong[q.id] = { wrong: 1 + randomInt(3), resolved: false, last: Date.now() - randomInt(86400000) };
      });
      app.view = "wrong";
      render();
    } else if (preview === "cram") {
      app.view = "cram";
      render();
    }
  }

  window.__QUIZ_DEBUG__ = {
    app,
    store,
    startPaper,
    buildPaper,
    startQuestionByIds,
    submitCurrent,
    nextQuestion,
    finishPaper,
    selfGradeCurrent,
    normalise: normalize,
    blankCorrect,
    questions: QUESTIONS,
  };

  /* ---------------- init ---------------- */
  window.addEventListener("beforeunload", () => {
    if (app.paper && app.view === "quiz") pausePaper();
  });

  render();
  buildPreview();

  const params = new URLSearchParams(window.location.search);
  if (params.get("selftest") === "1") {
    const failures = [];
    const assert = (cond, msg) => {
      if (!cond) failures.push(msg);
    };
    assert(QUESTIONS.length >= 100, `题库数量不足：${QUESTIONS.length}`);
    assert(new Set(QUESTIONS.map((q) => q.id)).size === QUESTIONS.length, "题目 ID 有重复");
    QUESTIONS.forEach((q) => {
      assert(Boolean(q.question), `${q.id} 缺题干`);
      assert(Boolean(q.explanation), `${q.id} 缺解析`);
      assert(q.chapter && CH_BY_ID.has(q.chapter), `${q.id} 章节无效`);
      if (q.type === "single") {
        assert(Number.isInteger(q.answer) && q.options[q.answer], `${q.id} 单选答案无效`);
      }
      if (q.type === "multiple") {
        assert(Array.isArray(q.answer) && q.answer.length >= 2, `${q.id} 多选答案无效`);
      }
      if (q.type === "fill") {
        const n = (q.question.match(/\{\{\d+\}\}/g) || []).length;
        assert(q.blanks && q.blanks.length === n, `${q.id} 填空数量与占位符不一致`);
      }
      if (q.type === "short") {
        assert(q.keywords && q.reference, `${q.id} 简答缺少关键词或参考答案`);
      }
    });
    assert(blankCorrect("1922年", ["1922"]), "数字单位容错失败");
    assert(blankCorrect("3：2", ["3∶2"]), "比例符号容错失败");
    assert(!blankCorrect("1925", ["1922"]), "错误数字被误判");
    const paper = buildPaper({ count: 20, types: { choice: true, fill: true, short: true }, mode: "test" });
    assert(paper.items.length === 20, `组卷数量错误：${paper.items.length}`);
    assert(new Set(paper.items.map((i) => i.qid)).size === 20, "组卷出现重复题");
    const hasChoice = paper.items.some((i) => Q_BY_ID.get(i.qid).type === "single");
    const hasFill = paper.items.some((i) => Q_BY_ID.get(i.qid).type === "fill");
    const hasShort = paper.items.some((i) => Q_BY_ID.get(i.qid).type === "short");
    assert(hasChoice && hasFill && hasShort, "组卷题型覆盖不足");
    document.title = failures.length ? `SELFTEST FAIL ${failures.length}` : "SELFTEST PASS";
    const box = document.createElement("pre");
    box.id = "selftest";
    box.textContent = failures.length ? failures.join("\n") : "PASS";
    document.body.appendChild(box);
  }
})();

</script>
    <script>
      (function () {
        var brand = document.querySelector(".brand-mark img");
        var splash = document.getElementById("splashEmblem");
        if (brand && splash) splash.src = brand.getAttribute("src");
      })();
    </script>
      <script>
      (function () {
        if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
          });
        }

        var standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;
        if (standalone) return;

        var deferredPrompt = null;
        var button = document.createElement("button");
        button.type = "button";
        button.className = "pwa-install-btn";
        button.hidden = true;
        button.setAttribute("aria-label", "安装到手机");
        button.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>' +
          "<span>安装到手机</span>";

        function mount() {
          if (!document.body.contains(button)) document.body.appendChild(button);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", mount);
        } else {
          mount();
        }

        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          deferredPrompt = event;
          mount();
          button.hidden = false;
        });

        button.addEventListener("click", function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choice) {
            if (choice.outcome === "accepted") button.hidden = true;
            deferredPrompt = null;
          });
        });

        window.addEventListener("appinstalled", function () {
          button.hidden = true;
          deferredPrompt = null;
        });
      })();
    </script>
</body>
</html>
