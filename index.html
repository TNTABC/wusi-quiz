    <title>五四共青团 · 入团教育随机刷题</title>

      if (new URLSearchParams(location.search).get("desktop") === "1") {

          document.documentElement.classList.remove("desktop-start");
        }, 1800);
      }
    </script>
    <style>
/* =========================================================
   五四共青团 · 入团教育随机刷题
   Palette: 团旗红 / 团徽金 / 宣纸暖白
   ========================================================= */

:root {
  --red-950: #4f050c;
  --red-900: #650811;
  --red-800: #7f0b16;
  --red-700: #98101d;
  --red-600: #b31a28;
  --red-500: #c7333f;
  --gold: #c5964a;
  --gold-strong: #b98535;
  --gold-soft: #e7c789;
  --gold-pale: #f4e6c8;
  --paper: #f5f0e6;
  --paper-deep: #eee6d8;
  --paper-light: #fbf8f1;
  --white: #fffdf9;
  --ink: #251b15;
  --ink-2: #5e4d40;
  --muted: #8a7a6d;
  --line: rgba(84, 56, 39, 0.14);
  --line-strong: rgba(84, 56, 39, 0.23);
  --green: #2f7b58;
  --green-soft: #e8f4ec;
  --green-line: rgba(47, 123, 88, 0.3);
  --wrong: #b5392a;
  --wrong-soft: #fbece8;
  --wrong-line: rgba(181, 57, 42, 0.28);
  --shadow-sm: 0 8px 22px rgba(69, 35, 20, 0.05);
  --shadow-md: 0 18px 46px rgba(69, 35, 20, 0.08);
  --shadow-lg: 0 30px 80px rgba(67, 20, 12, 0.18);
  --sans: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STZhongsong", "STSong", "SimSun", "Noto Serif SC", serif;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

img {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
}

::selection {
  background: var(--gold-pale);
  color: var(--red-900);
}

:focus-visible {
  outline: 2px solid var(--red-700);
  outline-offset: 3px;
}

.hidden {
  display: none !important;
}

.icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
}

.paper-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 8% 4%, rgba(197, 150, 74, 0.13), transparent 27%),
    radial-gradient(circle at 92% 90%, rgba(152, 16, 29, 0.07), transparent 33%),
    radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7), transparent 38%),
    var(--paper);
}

/* Desktop app launch splash */
.app-splash {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 90;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 38%, rgba(231, 199, 137, 0.16), transparent 32%),
    linear-gradient(135deg, #57050e, #7d0a15 50%, #9b101d);
  color: #fff8ec;
}

html.desktop-start .app-splash {
  display: flex;
  animation: splashAway 0.52s ease 1.05s forwards;
}

html.desktop-start,
html.desktop-start body {
  overflow: hidden;
}

.app-splash::before {
  content: "";
  position: absolute;
  width: 640px;
  height: 640px;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.16);
  box-shadow: 0 0 0 44px rgba(231, 199, 137, 0.035), 0 0 0 88px rgba(231, 199, 137, 0.022);
}

.splash-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: splashRise 0.65s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

.splash-emblem {
  width: 130px;
  height: 130px;
  padding: 14px;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.36);
  background: rgba(255, 248, 230, 0.06);
  box-shadow: 0 18px 50px rgba(30, 2, 5, 0.26), inset 0 0 0 6px rgba(231, 199, 137, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash-emblem img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 7px 16px rgba(30, 2, 5, 0.3));
}

.splash-kicker {
  margin-top: 27px;
  color: var(--gold-soft);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3em;
}

.splash-title {
  margin-top: 9px;
  font-family: var(--serif);
  font-size: 48px;
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1.2;
}

.splash-line {
  width: 190px;
  height: 1px;
  margin-top: 19px;
  overflow: hidden;
  background: rgba(231, 199, 137, 0.18);
}

.splash-line span {
  display: block;
  width: 55%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  animation: splashLine 1.1s ease both;
}

.splash-tip {
  margin-top: 18px;
  color: rgba(255, 248, 236, 0.48);
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.18em;
}

@keyframes splashRise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes splashLine {
  from {
    transform: translateX(-110%);
  }
  to {
    transform: translateX(190%);
  }
}

@keyframes splashAway {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

.paper-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.26;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(129, 96, 63, 0.035) 27px 28px),
    repeating-linear-gradient(90deg, transparent 0 27px, rgba(129, 96, 63, 0.025) 27px 28px);
  mask-image: radial-gradient(circle at 50% 30%, #000, transparent 90%);
}

/* ---------------- shell / rail ---------------- */
.app-shell {
  width: 100%;
  max-width: 1460px;
  min-height: 100vh;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 238px minmax(0, 1fr);
}

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 30px 20px 24px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255, 253, 249, 0.72), rgba(245, 240, 230, 0.38));
  backdrop-filter: blur(14px);
  z-index: 5;
}

.rail-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 6px;
}

.brand-mark {
  width: 52px;
  height: 52px;
  flex: 0 0 auto;
  padding: 4px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8e7, #f4e3be 60%, #e5c88f);
  box-shadow: 0 5px 16px rgba(115, 59, 21, 0.18), inset 0 0 0 1px rgba(164, 113, 38, 0.3);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}

.brand-copy strong {
  font-family: var(--serif);
  font-size: 19px;
  letter-spacing: 0.04em;
  color: var(--red-900);
}

.brand-copy span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.rail-greeting {
  margin: 42px 8px 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.rail-greeting > span {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.04em;
}

.rail-greeting p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.rail-nav {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.nav-item {
  position: relative;
  width: 100%;
  min-height: 46px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.nav-item .icon {
  width: 19px;
  height: 19px;
  color: var(--muted);
  transition: color 0.2s ease;
}

.nav-item span:not(.nav-badge) {
  font-size: 13px;
  letter-spacing: 0.03em;
}

.nav-item:hover {
  background: rgba(152, 16, 29, 0.055);
  color: var(--red-800);
  transform: translateX(2px);
}

.nav-item:hover .icon {
  color: var(--red-700);
}

.nav-item.active {
  background: linear-gradient(105deg, var(--red-800), var(--red-700));
  color: #fff8ec;
  box-shadow: 0 9px 20px rgba(127, 11, 22, 0.2);
}

.nav-item.active .icon {
  color: var(--gold-soft);
}

.nav-badge {
  margin-left: auto;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--gold-pale);
  color: var(--red-900);
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-item.active .nav-badge {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
}

.rail-bottom {
  margin-top: auto;
}

.rail-card {
  padding: 16px;
  border: 1px solid rgba(197, 150, 74, 0.32);
  border-radius: 16px;
  background: linear-gradient(145deg, rgba(255, 250, 239, 0.9), rgba(247, 238, 218, 0.6));
}

.rail-card-title {
  color: var(--gold-strong);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
}

.rail-card p {
  margin: 8px 0 10px;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.75;
}

.rail-card > span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.06em;
}

.rail-sign {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.22em;
}

.sign-line {
  width: 24px;
  height: 1px;
  background: var(--gold);
}

.view {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 34px 40px 72px;
  outline: none;
}

.view-enter {
  animation: viewIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

@keyframes viewIn {
  from {
    transform: translateY(9px);
  }
  to {
    transform: translateY(0);
  }
}

.mobile-nav {
  display: none;
}

/* ---------------- common ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.btn .icon {
  width: 18px;
  height: 18px;
}

.btn:not(:disabled):hover {
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: 0.45;
}

.btn-lg {
  min-height: 50px;
  padding: 0 24px;
  border-radius: 13px;
  font-size: 14px;
}

.btn-sm {
  min-height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  font-size: 12px;
}

.btn-primary {
  background: linear-gradient(105deg, var(--red-800), var(--red-700));
  color: #fff9ef;
  box-shadow: 0 10px 24px rgba(127, 11, 22, 0.22);
}

.btn-primary:not(:disabled):hover {
  box-shadow: 0 13px 30px rgba(127, 11, 22, 0.3);
}

.btn-gold {
  background: linear-gradient(110deg, #e8c98d, #d5aa61);
  color: var(--red-950);
  box-shadow: 0 10px 28px rgba(48, 8, 4, 0.22);
}

.btn-gold:not(:disabled):hover {
  background: linear-gradient(110deg, #f2d9a6, #dfb873);
}

.btn-ghost {
  border-color: var(--line-strong);
  background: rgba(255, 253, 249, 0.55);
  color: var(--ink-2);
}

.btn-ghost:not(:disabled):hover {
  border-color: rgba(152, 16, 29, 0.4);
  color: var(--red-800);
  background: var(--white);
}

.hero .btn-ghost {
  border-color: rgba(255, 255, 255, 0.26);
  background: rgba(255, 255, 255, 0.06);
  color: #fff7e9;
}

.hero .btn-ghost:not(:disabled):hover {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.12);
}

.btn-ok {
  border-color: var(--green-line);
  background: var(--green-soft);
  color: var(--green);
}

.btn-bad {
  border-color: var(--wrong-line);
  background: var(--wrong-soft);
  color: var(--wrong);
}

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--red-700);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.text-link .icon {
  width: 15px;
  height: 15px;
  transition: transform 0.2s ease;
}

.text-link:hover .icon {
  transform: translateX(3px);
}

.icon-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover {
  color: var(--red-700);
  border-color: var(--red-700);
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 253, 249, 0.88);
  box-shadow: var(--shadow-sm);
}

.eyebrow {
  color: var(--gold-strong);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.section {
  margin-top: 42px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 18px;
}

.section-head h2 {
  margin: 4px 0 0;
  font-family: var(--serif);
  font-size: 29px;
  line-height: 1.3;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.section-note {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.03em;
  padding-bottom: 4px;
}

/* ---------------- hero ---------------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 46px 48px 42px;
  border-radius: 28px;
  color: #fff8ec;
  background:
    radial-gradient(circle at 80% 20%, rgba(231, 199, 137, 0.18), transparent 31%),
    radial-gradient(circle at 12% 92%, rgba(255, 255, 255, 0.08), transparent 33%),
    linear-gradient(112deg, #5d0710 0%, #7e0b16 44%, #9d111e 100%);
  box-shadow: 0 28px 70px rgba(89, 11, 18, 0.23);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.5;
  background-image:
    repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 18px),
    linear-gradient(90deg, transparent 0 49.8%, rgba(231, 199, 137, 0.09) 49.8% 50%, transparent 50%);
  pointer-events: none;
}

.hero::after {
  content: "";
  position: absolute;
  width: 420px;
  height: 420px;
  right: -150px;
  bottom: -260px;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.2);
  box-shadow: 0 0 0 42px rgba(231, 199, 137, 0.03), 0 0 0 86px rgba(231, 199, 137, 0.025);
  pointer-events: none;
}

.hero-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) 290px;
  gap: 26px;
  align-items: center;
}

.hero-copy {
  max-width: 680px;
}

.kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold-soft);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.26em;
}

.kicker span {
  width: 26px;
  height: 1px;
  background: var(--gold-soft);
}

.hero h1 {
  margin: 20px 0 18px;
  font-family: var(--serif);
  font-size: clamp(38px, 4.4vw, 58px);
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: 0.05em;
  text-shadow: 0 3px 20px rgba(42, 3, 6, 0.18);
}

.hero h1 em {
  color: var(--gold-soft);
  font-style: normal;
  position: relative;
}

.hero h1 em::after {
  content: "";
  position: absolute;
  left: 2px;
  right: 4px;
  bottom: 1px;
  height: 5px;
  background: linear-gradient(90deg, rgba(231, 199, 137, 0.46), transparent);
  border-radius: 99px;
}

.hero-lead {
  max-width: 610px;
  margin: 0;
  color: rgba(255, 248, 236, 0.76);
  font-size: 13px;
  line-height: 1.95;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 26px;
  color: rgba(255, 248, 236, 0.52);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.hero-meta i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-soft);
  opacity: 0.7;
}

.hero-deco {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hero-year {
  position: absolute;
  right: 205px;
  bottom: -32px;
  font-family: var(--serif);
  font-size: 190px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 245, 224, 0.035);
  letter-spacing: -0.04em;
}

.hero-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.15);
}

.ring-a {
  width: 360px;
  height: 360px;
  right: 24px;
  top: -175px;
}

.ring-b {
  width: 490px;
  height: 490px;
  right: -38px;
  top: -240px;
  border-color: rgba(231, 199, 137, 0.09);
}

.ring-c {
  width: 220px;
  height: 220px;
  right: 93px;
  top: -103px;
  border-color: rgba(231, 199, 137, 0.18);
}

.hero-seal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 250px;
}

.seal-inner {
  width: 190px;
  height: 190px;
  padding: 20px;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.4);
  background:
    radial-gradient(circle at 38% 32%, rgba(255, 248, 230, 0.16), transparent 42%),
    rgba(255, 248, 230, 0.045);
  box-shadow: inset 0 0 0 7px rgba(231, 199, 137, 0.07), 0 18px 40px rgba(37, 2, 5, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.seal-inner img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 8px 18px rgba(42, 3, 6, 0.3));
}

.seal-caption {
  color: rgba(255, 248, 236, 0.56);
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 0.24em;
}

.resume-bar {
  margin-top: 16px;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid rgba(197, 150, 74, 0.32);
  border-radius: 15px;
  background: linear-gradient(90deg, rgba(255, 251, 240, 0.94), rgba(250, 242, 224, 0.7));
  box-shadow: var(--shadow-sm);
}

.resume-icon {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--gold-pale);
  color: var(--red-800);
  display: flex;
  align-items: center;
  justify-content: center;
}

.resume-icon .icon {
  width: 18px;
  height: 18px;
}

.resume-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.resume-copy strong {
  font-size: 13px;
  color: var(--ink);
}

.resume-copy span {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.resume-bar .btn {
  margin-left: auto;
}

/* ---------------- home stats ---------------- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin-top: 17px;
}

.stat-card {
  padding: 18px 20px 16px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255, 253, 249, 0.82);
  box-shadow: 0 7px 18px rgba(66, 35, 22, 0.035);
}

.stat-card.accent {
  border-color: rgba(197, 150, 74, 0.38);
  background: linear-gradient(135deg, #fffaf0, #fbf4e5);
}

.stat-label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.stat-card strong {
  display: block;
  margin: 7px 0 2px;
  font-family: var(--serif);
  font-size: 32px;
  line-height: 1.1;
  color: var(--red-900);
  font-weight: 700;
}

.stat-card.accent strong {
  color: var(--gold-strong);
}

.stat-card strong small {
  margin-left: 4px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 400;
}

.stat-foot {
  color: var(--muted);
  font-size: 10px;
}

/* ---------------- practice ---------------- */
.practice-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 14px;
}

.practice-panel {
  padding: 5px 26px 20px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 26px;
  padding: 21px 0;
  border-bottom: 1px solid var(--line);
}

.setting-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.setting-copy strong {
  font-size: 13px;
  color: var(--ink);
}

.setting-copy span {
  color: var(--muted);
  font-size: 10px;
}

.segmented {
  flex: 0 0 auto;
  display: flex;
  gap: 3px;
  padding: 4px;
  border-radius: 12px;
  background: #efe7d9;
}

.segmented button {
  min-width: 62px;
  height: 35px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  transition: all 0.2s ease;
}

.segmented button:hover {
  color: var(--red-800);
}

.segmented button.active {
  background: var(--white);
  color: var(--red-800);
  font-weight: 700;
  box-shadow: 0 3px 9px rgba(77, 41, 22, 0.1);
}

.type-toggles {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.type-toggle {
  min-width: 100px;
  height: 46px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255, 253, 249, 0.7);
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

.type-toggle:hover {
  border-color: rgba(152, 16, 29, 0.32);
  transform: translateY(-1px);
}

.type-toggle.on {
  border-color: rgba(152, 16, 29, 0.32);
  background: #fff7f4;
}

.check-dot {
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--white);
  color: var(--white);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.type-toggle.on .check-dot {
  border-color: var(--red-700);
  background: var(--red-700);
}

.check-dot .icon {
  width: 12px;
  height: 12px;
}

.type-name {
  display: block;
  color: var(--ink);
  font-size: 11px;
  line-height: 1.2;
  white-space: nowrap;
}

.type-toggle small {
  display: block;
  margin-left: auto;
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
}

.practice-start {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 20px;
}

.practice-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
}

.practice-hint .icon {
  width: 15px;
  height: 15px;
  color: var(--gold-strong);
}

.tip-panel {
  position: relative;
  overflow: hidden;
  padding: 24px;
  border-color: rgba(197, 150, 74, 0.33);
  background:
    radial-gradient(circle at 90% 0, rgba(197, 150, 74, 0.17), transparent 38%),
    linear-gradient(145deg, #fffaf0, #fbf3e2);
}

.tip-panel::after {
  content: "“";
  position: absolute;
  right: 16px;
  bottom: -40px;
  font-family: var(--serif);
  font-size: 150px;
  line-height: 1;
  color: rgba(197, 150, 74, 0.1);
}

.tip-head {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--gold-strong);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.tip-head .icon {
  width: 16px;
  height: 16px;
}

.tip-panel p {
  position: relative;
  z-index: 1;
  margin: 14px 0;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.9;
}

.tip-panel p strong {
  color: var(--red-800);
  font-family: var(--serif);
  font-size: 16px;
}

.tip-facts {
  position: relative;
  z-index: 1;
  padding: 10px 12px;
  border-left: 2px solid var(--gold);
  background: rgba(255, 255, 255, 0.48);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.tip-facts span {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.16em;
}

.tip-facts strong {
  color: var(--red-900);
  font-size: 11px;
}

.tip-panel .text-link {
  position: relative;
  z-index: 1;
  margin-top: 16px;
}

/* ---------------- chapters ---------------- */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.chapter-card {
  position: relative;
  min-height: 180px;
  padding: 20px 20px 16px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255, 253, 249, 0.78);
  text-align: left;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
}

.chapter-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--gold), transparent);
  opacity: 0;
  transition: opacity 0.22s ease;
}

.chapter-card:hover {
  transform: translateY(-3px);
  border-color: rgba(152, 16, 29, 0.24);
  background: var(--white);
  box-shadow: 0 14px 30px rgba(77, 39, 24, 0.07);
}

.chapter-card:hover::before {
  opacity: 1;
}

.chapter-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chapter-no {
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold-strong);
  letter-spacing: 0.1em;
}

.chapter-arrow {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.chapter-arrow .icon {
  width: 13px;
  height: 13px;
}

.chapter-card:hover .chapter-arrow {
  border-color: var(--red-700);
  background: var(--red-700);
  color: #fff;
}

.chapter-card > strong {
  display: block;
  margin-top: 15px;
  font-family: var(--serif);
  font-size: 20px;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.chapter-sub {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.6;
  min-height: 32px;
}

.chapter-foot {
  margin-top: auto;
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 9px;
}

.mini-track {
  margin-top: 7px;
  height: 3px;
  border-radius: 99px;
  background: #eee5d7;
  overflow: hidden;
}

.mini-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--red-700));
}

/* ---------------- facts / footer ---------------- */
.fact-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255, 253, 249, 0.7);
  overflow: hidden;
}

.fact {
  padding: 16px 18px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.fact:last-child {
  border-right: 0;
}

.fact span {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.1em;
}

.fact strong {
  margin-top: 3px;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.1;
  color: var(--red-900);
}

.fact small {
  color: var(--muted);
  font-size: 9px;
}

.home-foot {
  margin-top: 44px;
  padding: 22px 0 0;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.home-foot img {
  width: 30px;
  height: 30px;
  object-fit: contain;
  opacity: 0.74;
}

.home-foot p {
  max-width: 760px;
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.8;
}

.home-foot > span {
  margin-left: auto;
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
  padding-top: 3px;
}

/* ---------------- quiz ---------------- */
.quiz-shell {
  max-width: 1080px;
  margin: 0 auto;
}

.quiz-top {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
}

.back-btn:hover {
  color: var(--red-700);
}

.back-btn .icon {
  width: 16px;
  height: 16px;
}

.quiz-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  color: var(--muted);
  font-size: 11px;
}

.quiz-mode {
  color: var(--ink);
  font-weight: 600;
}

.crumb-divider {
  color: var(--line-strong);
}

.quiz-clock {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}

.quiz-clock .icon {
  width: 16px;
  height: 16px;
  color: var(--gold-strong);
}

.progress-line {
  height: 4px;
  margin-bottom: 20px;
  border-radius: 99px;
  background: #e9dfd0;
  overflow: hidden;
}

.progress-line span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--red-600) 55%, var(--red-800));
  transition: width 0.35s ease;
}

.quiz-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 252px;
  gap: 18px;
  align-items: start;
}

.question-card {
  padding: 30px 34px 26px;
  border: 1px solid var(--line);
  border-radius: 23px;
  background: rgba(255, 253, 249, 0.92);
  box-shadow: 0 16px 40px rgba(69, 35, 20, 0.06);
}

.question-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-size: 10px;
}

.q-number strong {
  color: var(--red-800);
  font-family: var(--serif);
  font-size: 16px;
}

.q-type {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 5px;
  background: #f1e9dc;
  color: var(--ink-2);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.q-type.multiple {
  background: #f6edda;
  color: #8a641f;
}

.q-type.fill {
  background: #eaf1ee;
  color: #376c58;
}

.q-type.short {
  background: #f7e8e4;
  color: #a23c2c;
}

.q-chapter {
  padding-left: 9px;
  border-left: 1px solid var(--line);
}

.q-diff {
  margin-left: auto;
  color: var(--gold);
  font-size: 8px;
  letter-spacing: 2px;
}

.question-text {
  margin: 20px 0 0;
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.65;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.question-image {
  margin-top: 20px;
  padding: 18px;
  border-radius: 16px;
  background: linear-gradient(145deg, #fbf3e3, #f7eddb);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 150px;
}

.question-image img {
  max-height: 180px;
  object-fit: contain;
  filter: drop-shadow(0 9px 16px rgba(97, 50, 20, 0.14));
}

.options {
  margin-top: 25px;
  display: grid;
  gap: 9px;
}

.option {
  width: 100%;
  min-height: 58px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fdfaf4;
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}

.option:not(:disabled):hover {
  border-color: rgba(152, 16, 29, 0.34);
  background: #fffdf9;
  transform: translateX(2px);
  box-shadow: 0 5px 14px rgba(80, 37, 22, 0.05);
}

.option:disabled {
  opacity: 1;
}

.option-letter {
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 9px;
  background: #f1e8d9;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  transition: all 0.18s ease;
}

.option-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.6;
}

.option-mark {
  width: 22px;
  flex: 0 0 auto;
  color: currentColor;
}

.option-mark .icon {
  width: 17px;
  height: 17px;
}

.option.selected {
  border-color: var(--red-700);
  background: #fff5f1;
  box-shadow: inset 0 0 0 1px rgba(152, 16, 29, 0.2);
}

.option.selected .option-letter {
  background: var(--red-700);
  color: #fff;
}

.option.is-correct {
  border-color: var(--green-line);
  background: var(--green-soft);
}

.option.is-correct .option-letter {
  background: var(--green);
  color: #fff;
}

.option.is-correct .option-mark {
  color: var(--green);
}

.option.is-wrong {
  border-color: var(--wrong-line);
  background: var(--wrong-soft);
}

.option.is-wrong .option-letter {
  background: var(--wrong);
  color: #fff;
}

.option.is-wrong .option-mark {
  color: var(--wrong);
}

.option.muted {
  opacity: 0.55;
}

/* fill */
.fill-text {
  margin-top: 24px;
  font-family: var(--serif);
  font-size: 21px;
  line-height: 2.55;
  color: var(--ink);
}

.blank-wrap {
  display: inline-flex;
  align-items: baseline;
  position: relative;
  margin: 0 3px;
  border-bottom: 2px solid var(--gold);
  transition: border-color 0.2s ease, background 0.2s ease;
}

.blank-wrap:focus-within {
  border-color: var(--red-700);
  background: #fff8e9;
}

.blank-wrap.ok {
  border-color: var(--green);
  background: rgba(232, 244, 236, 0.55);
}

.blank-wrap.bad {
  border-color: var(--wrong);
  background: rgba(251, 236, 232, 0.55);
}

.blank-input {
  min-width: 64px;
  height: 42px;
  padding: 0 7px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--red-900);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.blank-input:disabled {
  opacity: 1;
  -webkit-text-fill-color: var(--ink);
}

.blank-no {
  position: absolute;
  top: -17px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold-strong);
  font-family: var(--sans);
  font-size: 8px;
  font-weight: 600;
}

/* short */
.short-wrap {
  margin-top: 24px;
}

.short-input {
  width: 100%;
  min-height: 158px;
  padding: 16px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 15px;
  outline: 0;
  background: #fffdf8;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.9;
  resize: vertical;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.short-input:focus {
  border-color: rgba(152, 16, 29, 0.5);
  box-shadow: 0 0 0 3px rgba(152, 16, 29, 0.07);
}

.short-input:disabled {
  opacity: 1;
  background: #fbf7ef;
}

.short-count {
  margin-top: 7px;
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  color: var(--muted);
  font-size: 9px;
}

/* feedback */
.feedback {
  margin-top: 24px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.feedback.ok {
  border-color: var(--green-line);
  background: linear-gradient(90deg, var(--green-soft), rgba(232, 244, 236, 0.45));
}

.feedback.bad {
  border-color: var(--wrong-line);
  background: linear-gradient(90deg, var(--wrong-soft), rgba(251, 236, 232, 0.42));
}

.feedback.neutral {
  border-color: rgba(197, 150, 74, 0.4);
  background: linear-gradient(90deg, #fbf2df, rgba(251, 242, 223, 0.4));
}

.feedback-mark {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.62);
}

.feedback.ok .feedback-mark {
  color: var(--green);
}

.feedback.bad .feedback-mark {
  color: var(--wrong);
}

.feedback.neutral .feedback-mark {
  color: var(--gold-strong);
}

.feedback-mark .icon {
  width: 18px;
  height: 18px;
}

.feedback-copy strong {
  display: block;
  font-size: 13px;
  color: var(--ink);
}

.feedback-copy p {
  margin: 2px 0 0;
  color: var(--ink-2);
  font-size: 11px;
}

.keyword-box {
  margin-top: 12px;
  padding: 13px 15px;
  border: 1px dashed rgba(197, 150, 74, 0.5);
  border-radius: 13px;
  background: #fffcf4;
}

.keyword-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 10px;
}

.keyword-head strong {
  color: var(--gold-strong);
  font-family: var(--serif);
  font-size: 14px;
}

.keyword-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.keyword-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 25px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: 9px;
}

.keyword-chip .icon {
  width: 11px;
  height: 11px;
}

.keyword-chip.hit {
  border-color: var(--green-line);
  background: var(--green-soft);
  color: var(--green);
}

.keyword-chip i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--line-strong);
}

.explain {
  margin-top: 13px;
  padding: 18px 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 15px;
  background: #fbf8f1;
}

.explain-answer > span {
  display: block;
  margin-bottom: 6px;
  color: var(--gold-strong);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.explain-answer > div {
  color: var(--ink);
  font-size: 14px;
  line-height: 1.8;
  font-weight: 600;
}

.explain-answer > div.reference {
  font-weight: 400;
  white-space: pre-line;
  font-size: 13px;
  line-height: 1.95;
  padding-left: 12px;
  border-left: 2px solid var(--gold-soft);
}

.explain-text {
  margin: 12px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.9;
  white-space: pre-line;
}

.explain-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 9px;
}

.explain-foot > span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.explain-foot .icon {
  width: 12px;
  height: 12px;
}

.self-grade {
  margin-top: 13px;
  padding: 14px 16px;
  border: 1px solid rgba(197, 150, 74, 0.36);
  border-radius: 14px;
  background: linear-gradient(100deg, #fffaf0, #fbf4e7);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.self-grade > span {
  color: var(--ink-2);
  font-size: 11px;
}

.self-buttons {
  display: flex;
  gap: 7px;
}

.self-buttons .btn {
  min-height: 35px;
  padding: 0 12px;
  font-size: 11px;
}

.self-grade.done {
  border-color: var(--line);
  background: #faf7f0;
}

.question-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.shortcut-hint {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.02em;
}

.action-buttons {
  display: flex;
  gap: 8px;
}

/* quiz sidebar */
.quiz-side {
  position: sticky;
  top: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255, 253, 249, 0.82);
}

.side-label {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.13em;
}

.side-score {
  margin-top: 7px;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.side-score strong {
  font-family: var(--serif);
  font-size: 36px;
  line-height: 1;
  color: var(--red-900);
}

.side-score span {
  color: var(--muted);
  font-size: 10px;
}

.side-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: 9px;
}

.side-finish {
  width: 100%;
  margin-top: 12px;
}

.dot-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 12px;
}

.dot {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fdfaf4;
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s ease;
}

.dot:hover {
  border-color: var(--red-600);
  color: var(--red-700);
}

.dot.current {
  border-color: var(--red-700);
  background: var(--red-700);
  color: #fff;
}

.dot.ok {
  border-color: var(--green-line);
  background: var(--green-soft);
  color: var(--green);
}

.dot.bad {
  border-color: var(--wrong-line);
  background: var(--wrong-soft);
  color: var(--wrong);
}

.dot.done {
  border-color: rgba(197, 150, 74, 0.36);
  background: #fbf4e5;
}

.dot-legend {
  margin-top: 11px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 8px;
}

.dot-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.lg {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: #eee5d7;
}

.lg.current {
  background: var(--red-700);
}

.lg.ok {
  background: var(--green);
}

.lg.bad {
  background: var(--wrong);
}

.quote-card {
  position: relative;
  overflow: hidden;
  padding: 22px 20px;
  border-color: rgba(152, 16, 29, 0.4);
  background: linear-gradient(145deg, #7c0b15, #9b111e);
  color: #fff7e9;
}

.quote-mark {
  position: absolute;
  top: -12px;
  left: 12px;
  font-family: var(--serif);
  font-size: 80px;
  line-height: 1;
  color: rgba(231, 199, 137, 0.2);
}

.quote-card p {
  position: relative;
  margin: 16px 0 10px;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.85;
}

.quote-card > span {
  color: rgba(255, 247, 233, 0.55);
  font-size: 9px;
}

/* ---------------- result ---------------- */
.result-shell {
  max-width: 1080px;
  margin: 0 auto;
}

.result-hero {
  position: relative;
  overflow: hidden;
  padding: 38px 42px;
  border: 0;
  background:
    radial-gradient(circle at 84% 20%, rgba(231, 199, 137, 0.14), transparent 35%),
    linear-gradient(110deg, #5f0710, #8c0d19 60%, #a1121f);
  color: #fff8ec;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  box-shadow: 0 24px 60px rgba(89, 11, 18, 0.2);
}

.result-hero::after {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  right: 90px;
  bottom: -250px;
  border-radius: 50%;
  border: 1px solid rgba(231, 199, 137, 0.17);
  box-shadow: 0 0 0 44px rgba(231, 199, 137, 0.025);
}

.result-main {
  position: relative;
  z-index: 1;
}

.result-main .eyebrow {
  color: var(--gold-soft);
}

.result-main h1 {
  margin: 9px 0 8px;
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 40px);
  line-height: 1.3;
  letter-spacing: 0.02em;
}

.result-main > p {
  margin: 0;
  color: rgba(255, 248, 236, 0.68);
  font-size: 12px;
}

.result-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 23px;
  color: rgba(255, 248, 236, 0.67);
  font-size: 10px;
}

.result-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.result-meta .icon {
  width: 14px;
  height: 14px;
  color: var(--gold-soft);
}

.score-ring {
  position: relative;
  z-index: 1;
  width: 174px;
  height: 174px;
  flex: 0 0 auto;
  padding: 11px;
  border-radius: 50%;
  background: conic-gradient(var(--gold-soft) calc(var(--pct) * 1%), rgba(255, 248, 236, 0.12) 0);
  box-shadow: 0 15px 38px rgba(34, 2, 4, 0.2);
}

.score-ring-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 42% 32%, #9d111e, #6f0812);
  display: flex;
  align-items: baseline;
  justify-content: center;
  padding-top: 45px;
  box-shadow: inset 0 0 0 1px rgba(231, 199, 137, 0.28);
}

.score-ring-inner strong {
  font-family: var(--serif);
  font-size: 55px;
  line-height: 1;
  color: #fff8ec;
}

.score-ring-inner span {
  margin-left: 3px;
  color: var(--gold-soft);
  font-size: 12px;
}

.result-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.8fr);
  gap: 14px;
  margin-top: 15px;
}

.result-breakdown {
  padding: 23px 26px;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.panel-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 19px;
}

.panel-head > span {
  color: var(--muted);
  font-size: 9px;
}

.type-row {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr) 46px;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  color: var(--ink-2);
  font-size: 10px;
}

.type-row strong {
  text-align: right;
  color: var(--ink);
  font-size: 11px;
}

.type-track {
  height: 5px;
  border-radius: 99px;
  background: #eee4d6;
  overflow: hidden;
}

.type-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--red-700));
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.result-note {
  padding: 23px 24px;
  background: linear-gradient(145deg, #fffaf0, #fbf3e4);
  border-color: rgba(197, 150, 74, 0.34);
}

.result-note p {
  margin: 13px 0 17px;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.9;
}

.result-note p strong {
  color: var(--red-800);
  font-family: var(--serif);
  font-size: 17px;
}

.result-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.result-badges span {
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.5);
  color: var(--muted);
  font-size: 8px;
}

.review-section {
  margin-top: 30px;
}

.review-list {
  display: grid;
  gap: 8px;
}

.review-item {
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255, 253, 249, 0.8);
  overflow: hidden;
}

.review-item.wrong {
  border-color: rgba(181, 57, 42, 0.22);
}

.review-item summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 16px;
  cursor: pointer;
  user-select: none;
}

.review-item summary::-webkit-details-marker {
  display: none;
}

.review-no {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  border-radius: 7px;
  background: #f1e8d9;
  color: var(--ink-2);
  font-size: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.review-q {
  flex: 1;
  min-width: 0;
  color: var(--ink);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.review-tag {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: 4px;
  background: #eee5d7;
  color: var(--muted);
  font-size: 8px;
}

.review-item.wrong .review-tag {
  background: var(--wrong-soft);
  color: var(--wrong);
}

.review-item.right .review-tag {
  background: var(--green-soft);
  color: var(--green);
}

.review-item summary > .icon {
  width: 15px;
  height: 15px;
  color: var(--muted);
  transition: transform 0.2s ease;
}

.review-item[open] summary > .icon {
  transform: rotate(90deg);
}

.review-body {
  padding: 0 16px 16px 51px;
}

.review-line {
  display: flex;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 11px;
}

.review-line > span {
  flex: 0 0 54px;
  color: var(--muted);
}

.review-line p {
  margin: 0;
  color: var(--ink-2);
  white-space: pre-line;
}

.review-line p.right-answer {
  color: var(--green);
  font-weight: 600;
}

.review-explain {
  margin-top: 10px;
  padding: 10px 12px;
  border-left: 2px solid var(--gold-soft);
  background: #fbf7ee;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.85;
  white-space: pre-line;
}

.review-source {
  margin-top: 8px;
  color: var(--muted);
  font-size: 8px;
}

/* ---------------- page head / bank ---------------- */
.page-shell {
  max-width: 1080px;
  margin: 0 auto;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 24px;
}

.page-head h1 {
  margin: 8px 0 8px;
  font-family: var(--serif);
  font-size: clamp(30px, 3.6vw, 42px);
  line-height: 1.3;
  letter-spacing: 0.02em;
}

.page-head p {
  max-width: 670px;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.page-head-stat {
  flex: 0 0 auto;
  min-width: 92px;
  padding: 10px 14px;
  border: 1px solid rgba(197, 150, 74, 0.34);
  border-radius: 13px;
  background: #fffaf0;
  text-align: center;
}

.page-head-stat strong {
  display: block;
  font-family: var(--serif);
  font-size: 27px;
  line-height: 1.2;
  color: var(--red-900);
}

.page-head-stat span {
  color: var(--muted);
  font-size: 9px;
}

.bank-toolbar {
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-box {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  height: 39px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fffdf8;
  color: var(--muted);
}

.search-box .icon {
  width: 16px;
  height: 16px;
}

.search-box input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}

.search-box input::placeholder {
  color: #a49586;
}

.filter-group {
  display: flex;
  gap: 8px;
}

.filter-group select {
  height: 39px;
  padding: 0 28px 0 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: 0;
  background-color: #fffdf8;
  color: var(--ink-2);
  font-size: 11px;
  cursor: pointer;
}

.bank-count {
  padding: 14px 4px 9px;
  color: var(--muted);
  font-size: 10px;
}

.bank-list {
  border-top: 1px solid var(--line);
}

.bank-row {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  transition: background 0.18s ease;
}

.bank-row:hover {
  background: rgba(255, 253, 249, 0.65);
}

.bank-index {
  font-family: var(--serif);
  font-size: 11px;
  color: var(--gold-strong);
  letter-spacing: 0.06em;
}

.bank-body {
  min-width: 0;
}

.bank-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  color: var(--muted);
  font-size: 9px;
}

.bank-meta .q-type {
  height: 19px;
  padding: 0 6px;
  font-size: 8px;
}

.bank-diff {
  color: var(--gold);
  font-size: 7px;
  letter-spacing: 1px;
}

.bank-body h3 {
  margin: 5px 0 0;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.55;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}

.bank-actions {
  display: flex;
  align-items: center;
  gap: 13px;
  padding-left: 10px;
}

.bank-actions .btn {
  min-height: 30px;
  padding: 0 9px;
  font-size: 10px;
}

.bank-actions .btn .icon {
  width: 13px;
  height: 13px;
}

/* ---------------- wrong ---------------- */
.wrong-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

.wrong-note {
  color: var(--muted);
  font-size: 9px;
}

.wrong-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.wrong-card {
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(255, 253, 249, 0.82);
  display: flex;
  flex-direction: column;
}

.wrong-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  color: var(--muted);
  font-size: 9px;
}

.wrong-times {
  margin-left: auto;
  color: var(--wrong);
  font-weight: 600;
}

.wrong-date {
  color: #a49586;
}

.wrong-card h3 {
  margin: 10px 0 13px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.65;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.wrong-actions {
  margin-top: auto;
  display: flex;
  gap: 16px;
}

.empty-state {
  padding: 50px 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 18px;
  background: rgba(255, 253, 249, 0.55);
  text-align: center;
  color: var(--muted);
}

.empty-state.big {
  padding: 80px 24px;
  margin-top: 30px;
}

.empty-state > .icon {
  width: 38px;
  height: 38px;
  margin-bottom: 10px;
  color: var(--gold);
}

.empty-state h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
}

.empty-state p {
  margin: 7px 0 18px;
  font-size: 12px;
}

/* ---------------- cram ---------------- */
.cram-page .page-head {
  align-items: flex-start;
}

.cram-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.cram-card {
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255, 253, 249, 0.82);
  overflow: hidden;
}

.cram-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 15px 18px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(100deg, #fffaf0, rgba(255, 253, 249, 0.5));
}

.cram-tag {
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--red-700);
  color: #fff8ec;
  font-size: 8px;
  letter-spacing: 0.04em;
}

.cram-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 18px;
}

.cram-items {
  padding: 5px 18px 10px;
}

.cram-item {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr);
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
  align-items: baseline;
}

.cram-item:last-child {
  border-bottom: 0;
}

.cram-key {
  color: var(--gold-strong);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.7;
}

.cram-value {
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.75;
  transition: filter 0.2s ease;
}

.cram-page.conceal .cram-value {
  filter: blur(6px);
  user-select: none;
}

.cram-page.conceal .cram-item:hover .cram-value,
.cram-page.conceal .cram-item.revealed .cram-value {
  filter: none;
}

.cram-footer {
  margin-top: 16px;
  padding: 18px 22px;
  border-color: rgba(197, 150, 74, 0.35);
  background: #fffaf0;
}

.cram-footer > div {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--gold-strong);
  font-size: 11px;
  font-weight: 700;
}

.cram-footer .icon {
  width: 15px;
  height: 15px;
}

.cram-footer p {
  margin: 8px 0 0;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.9;
}

.cram-footer p strong {
  color: var(--red-800);
}

/* ---------------- modal ---------------- */
#modalRoot {
  position: relative;
  z-index: 50;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 24px;
  background: rgba(36, 19, 12, 0.52);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.18s ease both;
}

.modal {
  width: min(620px, 100%);
  max-height: min(82vh, 720px);
  overflow: auto;
  border: 1px solid rgba(197, 150, 74, 0.35);
  border-radius: 21px;
  background: var(--white);
  box-shadow: 0 30px 80px rgba(24, 10, 5, 0.3);
  animation: modalIn 0.24s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 0;
}

.modal-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: 0.02em;
}

.modal-body {
  padding: 15px 22px 4px;
}

.modal-text {
  margin: 0;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.9;
}

.modal-text strong {
  color: var(--red-800);
  font-family: var(--serif);
  font-size: 16px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 18px 22px 22px;
}

.modal-question-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  color: var(--muted);
  font-size: 9px;
}

.modal-question {
  margin: 10px 0 14px;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.6;
}

.modal-image {
  padding: 12px;
  border-radius: 13px;
  background: #fbf3e3;
  display: flex;
  justify-content: center;
}

.modal-image img {
  max-height: 145px;
  object-fit: contain;
}

.modal-options {
  list-style: none;
  margin: 12px 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.modal-options li {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink-2);
  font-size: 11px;
  display: flex;
  gap: 8px;
}

.modal-options li span {
  color: var(--muted);
  font-family: var(--serif);
  font-weight: 700;
}

.modal-options li.right {
  border-color: var(--green-line);
  background: var(--green-soft);
  color: var(--green);
}

.modal-answer {
  margin-top: 12px;
  padding: 11px 13px;
  border-left: 2px solid var(--gold);
  background: #fbf7ee;
}

.modal-answer span {
  display: block;
  margin-bottom: 3px;
  color: var(--gold-strong);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.15em;
}

.modal-answer p {
  margin: 0;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.8;
  white-space: pre-line;
}

.modal-explain {
  margin-top: 12px;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.9;
  white-space: pre-line;
}

.modal-source {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 11px;
  color: var(--muted);
  font-size: 9px;
}

.modal-source .icon {
  width: 12px;
  height: 12px;
}

body.modal-open {
  overflow: hidden;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---------------- toast ---------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  z-index: 80;
  max-width: min(88vw, 430px);
  padding: 10px 16px;
  border: 1px solid rgba(197, 150, 74, 0.35);
  border-radius: 99px;
  background: rgba(37, 27, 21, 0.94);
  color: #fff8ec;
  font-size: 11px;
  box-shadow: 0 12px 30px rgba(30, 12, 7, 0.25);
  opacity: 0;
  transform: translate(-50%, 12px);
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast.warn {
  border-color: rgba(231, 199, 137, 0.5);
  background: #8a5d1f;
}

/* ---------------- responsive ---------------- */
@media (max-width: 1220px) {
  .app-shell {
    grid-template-columns: 218px minmax(0, 1fr);
  }

  .view {
    padding: 28px 28px 64px;
  }

  .hero {
    padding: 40px 38px 36px;
  }

  .chapter-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .practice-grid {
    grid-template-columns: minmax(0, 1fr) 285px;
  }
}

@media (max-width: 980px) {
  .app-shell {
    display: block;
  }

  .rail {
    display: none;
  }

  .view {
    max-width: 820px;
    padding: 24px 22px 100px;
  }

  .mobile-nav {
    position: fixed;
    left: 50%;
    bottom: 14px;
    z-index: 40;
    width: min(calc(100vw - 28px), 520px);
    transform: translateX(-50%);
    padding: 7px;
    border: 1px solid rgba(197, 150, 74, 0.28);
    border-radius: 18px;
    background: rgba(255, 253, 249, 0.92);
    box-shadow: 0 14px 40px rgba(54, 24, 10, 0.16);
    backdrop-filter: blur(16px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  .mobile-nav .nav-item {
    min-height: 52px;
    padding: 5px 6px;
    flex-direction: column;
    gap: 2px;
    border-radius: 12px;
    justify-content: center;
    text-align: center;
  }

  .mobile-nav .nav-item span:not(.nav-badge) {
    font-size: 9px;
  }

  .mobile-nav .nav-item .icon {
    width: 18px;
    height: 18px;
  }

  .mobile-nav .nav-badge {
    position: absolute;
    top: 4px;
    right: 8px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    font-size: 8px;
  }

  .quiz-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .quiz-side {
    position: static;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .quote-card {
    display: none;
  }

  .result-grid {
    grid-template-columns: 1fr;
  }

  .fact-strip {
    grid-template-columns: repeat(3, 1fr);
  }

  .fact:nth-child(3) {
    border-right: 0;
  }

  .fact:nth-child(n + 4) {
    border-top: 1px solid var(--line);
  }

  .practice-grid {
    grid-template-columns: 1fr;
  }

  .tip-panel {
    min-height: 0;
  }

  .bank-row {
    grid-template-columns: 34px minmax(0, 1fr);
  }

  .bank-actions {
    grid-column: 2;
    padding-left: 0;
    margin-top: -3px;
  }
}

@media (max-width: 720px) {
  .view {
    padding: 18px 15px 96px;
  }

  .hero {
    padding: 28px 22px 26px;
    border-radius: 21px;
  }

  .hero-grid {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    margin-top: 16px;
    font-size: 36px;
  }

  .hero-lead {
    font-size: 12px;
  }

  .hero-seal {
    display: none;
  }

  .hero-year {
    right: 10px;
    font-size: 130px;
  }

  .hero-actions .btn {
    flex: 1;
    min-width: 0;
  }

  .hero-meta {
    margin-top: 20px;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .stat-card {
    padding: 14px 16px;
  }

  .stat-card strong {
    font-size: 27px;
  }

  .section {
    margin-top: 32px;
  }

  .section-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 13px;
  }

  .section-head h2 {
    font-size: 24px;
  }

  .section-note {
    padding-bottom: 0;
  }

  .practice-panel {
    padding: 2px 18px 17px;
  }

  .setting-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
    padding: 17px 0;
  }

  .segmented {
    width: 100%;
  }

  .segmented button {
    flex: 1;
  }

  .type-toggles {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .type-toggle {
    min-width: 0;
    height: 52px;
    padding: 0 8px;
    flex-wrap: wrap;
    gap: 2px 5px;
  }

  .type-toggle .type-name {
    font-size: 10px;
  }

  .type-toggle small {
    width: 100%;
    margin-left: 25px;
    margin-top: -2px;
    font-size: 8px;
  }

  .practice-start {
    align-items: stretch;
    flex-direction: column;
    gap: 12px;
  }

  .practice-start .btn {
    width: 100%;
  }

  .chapter-grid {
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }

  .chapter-card {
    min-height: 168px;
    padding: 16px 14px 13px;
  }

  .chapter-card > strong {
    font-size: 17px;
  }

  .chapter-sub {
    font-size: 9px;
  }

  .fact-strip {
    grid-template-columns: 1fr 1fr;
  }

  .fact {
    padding: 12px 13px;
    border-right: 0;
  }

  .fact:nth-child(odd) {
    border-right: 1px solid var(--line);
  }

  .fact:nth-child(n + 3) {
    border-top: 1px solid var(--line);
  }

  .fact:last-child {
    grid-column: 1 / -1;
    border-right: 0;
  }

  .home-foot {
    flex-wrap: wrap;
  }

  .home-foot > span {
    width: 100%;
    margin-left: 42px;
  }

  .resume-bar {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .resume-bar .btn {
    width: 100%;
    margin-left: 0;
  }

  .question-card {
    padding: 22px 18px 20px;
    border-radius: 18px;
  }

  .question-text {
    font-size: 21px;
    margin-top: 16px;
  }

  .question-meta {
    gap: 6px;
  }

  .q-diff {
    margin-left: 0;
  }

  .option {
    min-height: 54px;
    padding: 9px 11px;
    gap: 10px;
  }

  .option-text {
    font-size: 13px;
  }

  .option-letter {
    width: 28px;
    height: 28px;
    font-size: 13px;
  }

  .fill-text {
    font-size: 18px;
    line-height: 2.45;
  }

  .blank-input {
    font-size: 15px;
  }

  .quiz-top {
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 12px;
  }

  .quiz-crumb {
    order: 3;
    width: 100%;
  }

  .quiz-clock {
    font-size: 13px;
  }

  .quiz-side {
    grid-template-columns: 1fr;
  }

  .side-card {
    padding: 14px;
  }

  .dot-grid {
    grid-template-columns: repeat(8, 1fr);
  }

  .dot {
    height: 30px;
  }

  .question-actions {
    align-items: stretch;
    flex-direction: column-reverse;
    gap: 10px;
  }

  .action-buttons {
    width: 100%;
  }

  .action-buttons .btn {
    width: 100%;
  }

  .shortcut-hint {
    text-align: center;
  }

  .self-grade {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .self-buttons {
    width: 100%;
  }

  .self-buttons .btn {
    flex: 1;
  }

  .result-hero {
    padding: 26px 22px;
    align-items: flex-start;
    flex-direction: column;
    gap: 16px;
  }

  .score-ring {
    width: 135px;
    height: 135px;
    align-self: flex-end;
    margin-top: -20px;
    padding: 9px;
  }

  .score-ring-inner {
    padding-top: 36px;
  }

  .score-ring-inner strong {
    font-size: 42px;
  }

  .result-meta {
    gap: 10px;
    margin-top: 16px;
  }

  .result-actions .btn {
    flex: 1;
  }

  .review-body {
    padding-left: 16px;
  }

  .page-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 13px;
  }

  .page-head-stat {
    align-self: flex-start;
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
    padding: 6px 11px;
  }

  .page-head-stat strong {
    font-size: 20px;
  }

  .bank-toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .filter-group {
    width: 100%;
  }

  .filter-group select {
    flex: 1;
    min-width: 0;
  }

  .bank-row {
    grid-template-columns: 1fr;
    gap: 5px;
    padding: 14px 4px;
  }

  .bank-index {
    display: none;
  }

  .bank-actions {
    grid-column: 1;
    justify-content: flex-start;
    padding-top: 2px;
  }

  .wrong-list {
    grid-template-columns: 1fr;
  }

  .cram-grid {
    grid-template-columns: 1fr;
  }

  .cram-item {
    grid-template-columns: 78px minmax(0, 1fr);
  }

  .cram-page .page-head .btn {
    width: 100%;
  }

  .modal-backdrop {
    padding: 12px;
    align-items: flex-end;
  }

  .modal {
    max-height: 88vh;
    border-radius: 19px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  .toast {
    bottom: 88px;
  }
}

@media (max-width: 420px) {
  .hero h1 {
    font-size: 31px;
  }

  .chapter-grid {
    grid-template-columns: 1fr;
  }

  .chapter-card {
    min-height: 150px;
  }

  .type-toggles {
    grid-template-columns: 1fr;
  }

  .type-toggle {
    height: 44px;
  }

  .type-toggle small {
    width: auto;
    margin-left: auto;
    margin-top: 0;
  }

  .dot-grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .app-splash {
    display: none !important;
  }
}

/* print-friendly fallback */
@media print {
  .rail,
  .mobile-nav,
  .hero-deco,
  .hero-actions,
  .quiz-side,
  .question-actions,
  .toast,
  #modalRoot {
    display: none !important;
  }

  body {
    background: #fff;
  }

  .view {
    max-width: none;
    padding: 0;
  }

  .hero,
  .result-hero {
    box-shadow: none;
    background: #fff !important;
    color: #000;
    border: 1px solid #ccc;
  }
}

  const $ = (sel, root) => (root || document).querySelector(sel);

  function escapeHTML(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escapeAttr(value) {
    return escapeHTML(value).replace(/\n/g, " ");
  }

  function normalize(value) {
    return String(value == null ? "" : value)
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[\s\u3000]+/g, "")
      .replace(/[，。、；：,.;:!?！？"'“”‘’《》〈〉<>()（）【】\[\]{}·—–\-_/\\|]/g, "")
      .replace(/[：:∶]/g, "");
  }

  function randomInt(max) {
    if (max <= 0) return 0;
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i -= 1) {
      const j = randomInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function sampleOne(arr) {
    return arr.length ? arr[randomInt(arr.length)] : null;
  }

  function formatDuration(seconds) {
    const s = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  function formatDate(ts) {
    if (!ts) return "—";
